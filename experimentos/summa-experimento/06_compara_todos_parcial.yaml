# ==========================================================================
# Comparacao Bayesiana Pareada (camada COMPLEMENTAR)
# ==========================================================================
# Friedman/Wilcoxon/Nemenyi acima continuam sendo a analise principal. Esta
# camada acrescenta o que o teste de hipotese nula nao expressa: a
# probabilidade posterior de EQUIVALENCIA PRATICA. "Equivalente" vira achado,
# nao falha em rejeitar H0; "inconclusivo" e desfecho legitimo.
# Metodo: teste de sinais bayesiano (Benavoli et al., 2017), via
#   util_est_bayesiana.py (baycomp como implementacao de referencia).
# Saida: compara/analises_comparacao_summa_todos/bayesiana/
# Reexecutar SO esta etapa (nao refaz a comparacao pesada):
#   python ../../src/comparar_extracoes.py --config 06_compara_todos_parcial.yaml --bayesiana
# ==========================================================================

estatistica_bayesiana:
  ativo: true

  # --- Likert do juiz LLM (secao PRINCIPAL) ---
  # Escala ORDINAL de 4 pontos -> baycomp.SignTest, que conta direcoes e
  # descarta magnitude. Adequado porque a distancia entre as notas 2 e 3 nao e
  # comparavel a distancia entre 3 e 4.
  #
  # NOTA: enquanto campos_parquet.avaliacao estiver vazio nao ha notas do juiz
  #   e a secao principal e omitida com aviso; so as metricas automaticas rodam.
  rope_likert: 0.5               # Margem sobre as NOTAS. Como a escala e inteira,
                                 #   0,5 significa exatamente "notas iguais" — nao e
                                 #   margem arbitrada nem calibrada, e a traducao
                                 #   direta da escala. Nao ha analise de sensibilidade
                                 #   a ela: alterar deixaria de representar a escala.
                                 #   Deve ser > 0: com ROPE zero o baycomp devolve so
                                 #   (p_esquerda, p_direita), sem a equivalencia.
  metodo_likert: sinais          # sinais = SignTest (padrao) | postos = SignedRankTest
                                 #        | t = CorrelatedTTest

  limiar: 0.80                   # probabilidade minima p/ classificar uma celula do heatmap
  amostras: 200000               # amostras da posterior (200000 na analise definitiva)
  semente: 42                    # reprodutibilidade — registrar na dissertacao
  incluir_base: false            # ignorado quando 'protocolos' abaixo e um dicionario

  # --- Recortes por questao de pesquisa ---
  # 16 protocolos ativos = 120 pares e um heatmap ilegivel. Cada entrada abaixo
  # gera um conjunto proprio de figuras/tabelas, com o nome virando prefixo dos
  # arquivos (ex.: bayes_q1_ajuste_fino_likert_bertscore_heatmap.png) e uma
  # secao propria no relatorio.
  # Aceita alias ou rotulo; a ORDEM declarada e a ordem das linhas/colunas —
  # o que permite ler os heatmaps das varias metricas lado a lado.
  # Ajustar as listas e rodar com --bayesiana NAO refaz a comparacao.
  # Para um recorte unico e sem prefixo, use uma lista simples:
  #   protocolos: ["A", "B", "C", "D1"]
  protocolos:
    # Q1 — efeito do ajuste fino: zero-shot vs LoRA vs Full FT
    Q1_ajuste_fino: ["A", "B", "C"]
    # Q2 — efeito do CL: FT direto vs CL por etapas / acumulado
    Q2_curriculo: ["B", "C", "D1", "D3"]
    # Q3 — direcao do escalonamento: FF->LoRA vs LoRA->FF
    Q3_escalonamento: ["D1", "D2", "D3", "D4"]
    # Q4 — ablacoes: escalonamento sem CL, CL LoRA-only
    Q4_ablacoes: ["C", "D5", "D6", "D7", "D8"]
    # Q5 — direcao do curriculo: CL vs anti-CL (mesma base LoRA-only 4b)
    Q5_anti_cl: ["D7", "D8", "D9", "D10"]
    # Q6 — protocolos fundidos vs baselines
    Q6_fusao: ["B", "C", "D21", "D22", "D23"]

  # --- Metricas automaticas (secao COMPLEMENTAR) ---
  # Medem similaridade com o modelo base (Prof), ou seja FIDELIDADE DE
  # DESTILACAO, nao qualidade: um protocolo que reproduz fielmente um erro do
  # professor e premiado por elas. Servem como triangulacao, nunca como veredito.
  metricas_automaticas:
    # Escala CONTINUA -> baycomp.CorrelatedTTest, que usa a MAGNITUDE das
    # diferencas e responde diretamente "qual protocolo chega mais perto do
    # professor". O SignTest responderia "qual zona concentra mais documentos",
    # que nao e a pergunta desta etapa.
    metodo: t                    # t = CorrelatedTTest (padrao) | sinais | postos

    # ROPE: margem sobre os ESCORES BRUTOS — |x - y| <= rope conta como empate.
    # Obrigatoria (> 0). Com escores comprimidos e a ROPE que determina o
    # resultado: pequena demais satura o heatmap em verde/vermelho, grande
    # demais deixa tudo azul. Por isso a varredura abaixo e obrigatoria de
    # reportar — a matriz em tres ROPEs e o minimo defensavel.
    rope: 0.01
    rope_sensibilidade: [0.005, 0.01, 0.02]

    # Mesmos agregados de campos_estatisticas, sem o "(global)": Likert e
    # MetaDados sao os alvos de interesse das comparacoes pareadas.
    campos:
      - "Likert"
      - "MetaDados"
    metricas:
      - bertscore
      - sbert_medio