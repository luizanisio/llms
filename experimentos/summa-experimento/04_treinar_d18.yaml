# Executar com: python ../../src/treinar_unsloth.py --treinar 04_treinar_d18.yaml
# Executar com: python ../../src/treinar_unsloth.py --datasets 04_treinar_d18.yaml

# ==========================================================================
# CONFIGURAÇÃO DE TREINAMENTO - Qwen2.5-7B-Instruct (Protocolo D18)
# ==========================================================================
# Papel:   Controle (blocos aleatórios — separa ordenação de efeito de bloco)
# Modo:    LoRA 16 bits + estágios em TERÇOS ALEATÓRIOS (sem ordenação)
# Etapas:  b1 → b2 → b3 → completo (2 épocas cada)
# Objetivo: Estrutura idêntica ao D17 (mesmas fronteiras, mesmos tamanhos de
#           fatia, mesmo orçamento), mas com atribuição ALEATÓRIA das
#           instâncias aos estágios. D18 vs D17 isola "ordenar por
#           dificuldade" de "treinar em blocos com recência" — o controle
#           que a literatura de CL costuma exigir.
# Orçamento: (b1+b2+b3 = N) × 2 + completo N × 2 = 4N instâncias.
# Comparar: d18 vs d17 (ordenação por dificuldade), d18 vs d16 (efeito de bloco)
# Ambiente: H100 80GB (1 GPU via Slurm)
# Nota VRAM: ver cabeçalho do D16 (7B em 16 bits com seq 32768).
#
# PRÉ-REQUISITO: gerar o CSV com a coluna 'bloco' (b1/b2/b3 em terços
# aleatórios, seed 3407) rodando neste diretório:
#   python gerar_divisao_blocos_d18.py
#   → divisao_Qwen235b_Qwen7b_blocos.csv (7385 linhas por bloco)
# ==========================================================================

#| =========================================================================
#| MISCELÂNEA
#| =========================================================================
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/summa-experimento
    - /mnt/d/wsl_dev/llms/experimentos/summa-experimento
    - /opt/app-root/src/luiz/llms/experimentos/summa-experimento
  pastas_modelos:
    - /students/luiz.abatitucci/models
    - /mnt/d/wsl_ollama/hf-models
    - /opt/app-root/src/luiz/llms/_models

#| =========================================================================
#| CURRICULUM
#| =========================================================================
curriculum:
  saida:
    dataframe: saida/saida_or_235b.parquet
    dataframe_col: resposta
    dataframe_id: chave
    formato: json
    texto_criptografado: false

  entrada:
    dataframe: dados/integras_experimento_summa_novos.parquet
    dataset_filtro: {"fold": "<=10"}
    dataframe_col: integra
    dataframe_id: seq_documento_acordao
    prompt_template: dados/prompt_summa_raw.txt
    tag_texto: '<<--TEXTO-->>'
    texto_criptografado: false
    prompt_criptografado: false

  validacao:
    exigir_json_valido: true
    exigir_ids_pareados: false

  #| Mesma topologia do D17, com filtro por bloco aleatório no lugar da dificuldade.
  divisao:
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b_blocos.csv
    dataset_filtro: {"bloco": "b1"}
    alias: "bloco-1"
    tipo: "lora"
    pace_epochs: 2
    learning_rate: 2e-05
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b_blocos.csv
    dataset_filtro: {"bloco": "b2"}
    alias: "bloco-2"
    tipo: "lora"
    pace_epochs: 2
    learning_rate: 2e-05
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b_blocos.csv
    dataset_filtro: {"bloco": "b3"}
    alias: "bloco-3"
    tipo: "lora"
    pace_epochs: 2
    learning_rate: 2e-05
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b_blocos.csv
    alias: "completo"
    tipo: "lora"
    pace_epochs: 2
    learning_rate: 2e-05

#| =========================================================================
#| MODELO
#| =========================================================================
modelo:
  base_model_name: Qwen2.5-7B-Instruct
  saida: treinos/Qwen2.5-7B-Instruct(d18)
  ollama: Qwen2.5-7B-Instruct(d18):latest
  ollama_base: qwen2.5:7b
  ollama_url:

#| =========================================================================
#| TREINAMENTO
#| =========================================================================
treinamento:
  flash_attention_2: true
  liger_kernel: true
  full_com_sdpa: true   # irrelevante aqui (todas as etapas são LoRA), mantido por padrão

  eval_steps: 20%

  batch_size:
    efetivo: 16
    batch_size: 1
  grad_batch_size: 8

  num_train_epochs: 4
  max_seq_length: 32768
  validar_max_seq_length: true
  filtrar_max_seq_length: true

  learning_rate: 2e-05
  max_grad_norm: 1
  save_checkpoints: true
  resume_from_checkpoint: true
  warmup_steps: 100          # Idêntico a D16/D17 — fronteiras comparáveis
  weight_decay: 0.01
  optim: adamw_8bit

  lr_scheduler_type: cosine
  seed: 3407

  nbits: 16                  # Sem NF4: mesma precisão de D16/D17

  train_on_responses_only: true

#| =========================================================================
#| LORA (Low-Rank Adaptation)
#| =========================================================================
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
