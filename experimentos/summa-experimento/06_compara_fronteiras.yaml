  rotulo: "Qwen235b"
  alias: "Prof"
  familia: "Qwen-235B"

# Modelos Comparados
modelos_comparacao:
  # --- A: zero-shot (sem ajuste fino) ---
  - arquivo: "saida/saida_qwen7b.parquet"
    rotulo: "Qwen7B"
    alias: "A"
    familia: "Qwen-7B"
    baseline: true
  # --- B: LoRA 4b direto, dados completos (sem CL) ---
  - arquivo: "saida/saida_qwen7b(b)_teste.parquet"
    rotulo: "Qwen7B(b)"
    alias: "B"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(b)"
  # --- C: Full FT 16b direto, dados completos (sem CL) ---
  - arquivo: "saida/saida_qwen7b(c)_teste.parquet"
    rotulo: "Qwen7B(c)"
    alias: "C"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(c)"
  # --- D5: Escalonamento FF→LoRA sem CL (dados completos) ---
  - arquivo: "saida/saida_qwen7b(d5)_teste.parquet"
    rotulo: "Qwen7B(d5)"
    alias: "D5"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d5)"
  # --- D6: Escalonamento LoRA→FF sem CL (dados completos) ---
  - arquivo: "saida/saida_qwen7b(d6)_teste.parquet"
    rotulo: "Qwen7B(d6)"
    alias: "D6"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d6)"
  # --- D12: CL acumulado granular (10 etapas) + LoRA→FF ---
  - arquivo: "saida/saida_qwen7b(d12)_teste.parquet"
    rotulo: "Qwen7B(d12)"
    alias: "D12"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d12)"
  # --- D16: Sem CL, 4 execuções com dados completos, LoRA 16b (fronteira pura) ---
  - arquivo: "saida/saida_qwen7b(d16)_teste.parquet"
    rotulo: "Qwen7B(d16)"
    alias: "D16"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d16)"
  # --- D17: CL por etapas, LoRA 16b (D7 sem quantização) ---
  - arquivo: "saida/saida_qwen7b(d17)_teste.parquet"
    rotulo: "Qwen7B(d17)"
    alias: "D17"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d17)"
  # --- D18: Blocos aleatórios (terços), LoRA 16b (controle de efeito de bloco) ---
  - arquivo: "saida/saida_qwen7b(d18)_teste.parquet"
    rotulo: "Qwen7B(d18)"
    alias: "D18"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d18)"
  # --- D21: FUSÃO: CL por etapas, LoRA 16b, fronteiras virtuais (espelho do D17) ---
  - arquivo: "saida/saida_qwen7b(d21)_teste.parquet"
    rotulo: "Qwen7B(d21)"
    alias: "D21"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d21)"
  # --- D24: FUSÃO: CL granular (10 spans) + gating 10%, LoRA 4b (espelho do D12) ---
  - arquivo: "saida/saida_qwen7b(d24)_teste.parquet"
    rotulo: "Qwen7B(d24)"
    alias: "D24"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d24)"
  # --- D25: FUSÃO: CL granular (10 spans) + gating 10%, Full FT 16b ---
  - arquivo: "saida/saida_qwen7b(d25)_teste.parquet"
    rotulo: "Qwen7B(d25)"
    alias: "D25"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d25)"

# Configuração das Métricas e Campos
configuracao_comparacao:
  padronizar_simbolos: true
  rouge_stemmer: true

  filtro:
    arquivo: "dados/divisao_Qwen235b_Qwen7b.csv"
    campo_id: "id"
    dataset_filtro: {"alvo": "teste"}

  nome_campo_id: "id"
  rotulo_campo_id: "ID"

  campos_parquet:
    id: "chave"
    resposta: "resposta"
    resumo_tokens: "resumo"
    avaliacao: ""
    erro: "erro"

  modelos:
    sbert:
      medio: "stjiris/bert-large-portuguese-cased-legal-mlm-mkd-nli-sts-v1"
    bertscore: "stjiris/bert-large-portuguese-cased-legal-mlm-mkd-nli-sts-v1"
    bertscore_batch_size: 1024
    sbert_batch_size: 1024

  mascaras:
    extracao: "^(.+)\\.json$"
    tokens: ".tokens.json"
    avaliacao: ".avaliacao.json"
    observabilidade: ".obs.json"

  # Configuração das análises estatísticas (Friedman, Wilcoxon, Nemenyi, etc.)
  # Sem este bloco o padrao seria apenas "(global)"; os agregados Likert e
  # MetaDados sao os alvos de interesse para as comparacoes pareadas.
  campos_estatisticas:
    campos:
      - "(global)"
      - "Likert"
      - "MetaDados"
    metricas:
      - bertscore
      - sbert_medio
      - sbert_grande

  campos:
    bertscore:
      - "(global)"
      - "Materia"
      - "Dispositivo"
      - "Temas"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

    rouge_1:

    rouge_2:
      - "Partes"
      - "Partes.Tipo"
      - "Partes.Nome"

    rouge_l:
      - "Materia"
      - "Dispositivo"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

    levenshtein:
      - "Tipo"
      - "DataJulgamento"

    sbert_medio:
      - "(global)"
      - "Materia"
      - "Dispositivo"
      - "Temas"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

    sbert_grande:
      - "(global)"
      - "Materia"
      - "Dispositivo"
      - "Temas"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

campos_virtuais:
  Likert:
    - Materia
    - Temas.Ponto
    - Temas.Argumentos
    - Temas.Doutrina
    - Temas.Conceitos
    - Resumo
  MetaDados:
    - Partes.Tipo
    - Partes.Nome
    - Temas.Normas
    - Temas.Jurisprudencia
