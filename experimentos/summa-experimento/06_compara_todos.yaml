# ==========================================================================
# Estatística — camada frequentista + camada bayesiana
# ==========================================================================
# Frequentista (Friedman → Wilcoxon com Holm → Nemenyi/CD): diz SE existe
#   diferença entre os protocolos.
# Bayesiana (baycomp.CorrelatedTTest — analítico, sem amostragem nem semente):
#   diz O QUANTO acreditar — P(A > B) e P(equivalência prática dentro da ROPE).
#   Aqui "equivalente" é um achado, e "inconclusivo" é um desfecho legítimo.
# As duas camadas usam os mesmos recortes de `protocolos`.
# Saída: compara/analises_comparacao_summa_todos/estatisticas/ e .../bayesiana/
# Reexecutar só esta etapa (não refaz a comparação pesada):
#   python ../../src/comparar_extracoes.py --config 06_compara_todos.yaml --estatisticas
# ==========================================================================

estatistica:
  frequentista: true     # Friedman, Wilcoxon (Holm), Nemenyi e CD diagram
  bayesiana: true        # heatmaps de P(A > B) e P(equivalência), relatório bayesiano
  limiar: 0.95           # probabilidade mínima para decidir um par;
                         #   abaixo disso o par sai como "inconclusivo"
  incluir_base: false    # ignorado quando `protocolos` é um dicionário
  rope_likert: 0.01      # margem sobre as NOTAS do juiz LLM (obrigatória > 0).
                         #   Só tem efeito quando campos_parquet.avaliacao aponta
                         #   para as avaliações — hoje vazio, então a seção Likert
                         #   é omitida e só as métricas automáticas rodam.

  # --- Recortes: um conjunto de figuras/tabelas por questão de pesquisa ---
  # O nome do recorte vira prefixo dos arquivos e seção do relatório; a ordem
  # declarada é a ordem das linhas/colunas dos heatmaps. Aceita alias ou rótulo.
  # Protocolos ausentes (comentados / ainda em treinamento) são ignorados.
  # "TODOS" = todos os modelos ativos. Alterar aqui só exige --estatisticas.
  protocolos:
    # Q1 — efeito do ajuste fino: zero-shot vs LoRA vs Full FT (3 contrastes)
    Q1_ajuste_fino: ["A", "B", "C"]
    # Q2a — CL controlado: D17xD18 = ordenar por dificuldade vs blocos
    #   aleatórios; D17xD16 = CL vs sem estrutura; D16xB16 = custo puro
    #   de fronteira (6 contrastes)
    Q2a_cl_controlado: ["B16", "D16", "D18", "D17"]
    # Q2b — CL puro: CL sem escalonamento, em cada regime (10 contrastes)
    Q2b_cl_puro: ["B", "D7", "D8", "D13", "D14"]
    # Q2c — granularidade: progressão granular (10 etapas) vs saltos (3)
    #   (6 contrastes)
    Q2c_granularidade: ["D3", "D4", "D11", "D12"]
    # Q3a — direção do escalonamento com CL: FF->LoRA vs LoRA->FF (6 contrastes)
    Q3a_direcao_com_cl: ["D1", "D2", "D3", "D4"]
    # Q3b — direção do escalonamento sem CL (controle) (6 contrastes)
    Q3b_direcao_sem_cl: ["B", "C", "D5", "D6"]
    # Q4a — decomposição 2x2: CL só, escalonamento só, os dois, nenhum
    #   (10 contrastes)
    Q4a_decomposicao: ["B", "C", "D1", "D5", "D7"]
    # Q4b — unfreeze progressivo: D19 > D20 > C => sinergia CL+PT (3 contrastes)
    Q4b_unfreeze: ["B", "C", "D20", "D19"]
    # Q5 — direção do currículo: CL vs anti-CL (mesma base LoRA-only 4b)
    #   (10 contrastes)
    Q5_anti_curriculo: ["B", "D7", "D8", "D9", "D10"]
    # Q6a — fusão: D21xD17 = fundido vs segmentado, mesma topologia — teste
    #   mais limpo do custo de fronteira (10 contrastes)
    Q6a_fusao: ["B", "C", "B16", "D17", "D21", "D22", "D23"]
    # Q6b — fusão granular; regime full vs LoRA (3 contrastes)
    Q6b_fusao_granular: ["B", "C", "D12", "D24", "D25"]
    # Q6c — transição de regime: pré-treino LoRA e estabilização pós-merge
    #   (6 contrastes)
    Q6c_transicao_regime: ["B", "C", "D13", "D14", "D15"]
    # Panorama geral: todos os modelos ativos, para visão global
    Panorama_Geral: "TODOS"

  # --- Métricas automáticas (camada COMPLEMENTAR) ---
  # Medem similaridade com o modelo base = FIDELIDADE DE DESTILAÇÃO, não
  # qualidade: quem copia fielmente um erro do professor é premiado por elas.
  # Servem para triangular, nunca como veredito.
  metricas_automaticas:
    # ROPE = margem de empate sobre os ESCORES BRUTOS: |x - y| <= rope é empate.
    # Obrigatória (> 0) e decisiva — pequena demais pinta o heatmap de
    # vencedores/perdedores, grande demais deixa tudo empatado. A varredura de
    # sensibilidade (rope/2, rope, 2·rope) é calculada automaticamente por campo.
    # PENDENTE DE CALIBRAÇÃO: rodar antes `06_compara_d1ab.yaml` e transcrever
    # os valores de `estatisticas/00_rope_sugerido.md` (a menor margem sob a qual
    # TODOS os pares de réplicas atingem P(equivalência) >= `limiar`).
    # `rope` é o fallback dos campos não listados em `rope_por_campo`.
    rope: 0.01               # PROVISÓRIO
    # rope_por_campo:        # transcrever de 00_rope_sugerido.md
    #   Likert: 0.0000
    #   MetaDados: 0.0000

    # Likert e MetaDados são os alvos de interesse das comparações pareadas.
    campos:
      - "Likert"
      - "MetaDados"
    metricas:
      - bertscore
      - sbert_medio
      - rouge_l
