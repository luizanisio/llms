# Executar com: python ../../src/treinar_unsloth.py --treinar 04_treinar_d16.yaml
# Executar com: python ../../src/treinar_unsloth.py --datasets 04_treinar_d16.yaml

# ==========================================================================
# CONFIGURAÇÃO DE TREINAMENTO - Qwen2.5-7B-Instruct (Protocolo D16)
# ==========================================================================
# Papel:   Controle ("B segmentado" — custo puro de fronteira)
# Modo:    LoRA 16 bits, dados completos, 4 execuções seriais de trainer
# Etapas:  completo-1 → completo-2 → completo-3 → completo-4 (1 época cada)
# Objetivo: Precificar o custo intrínseco das fronteiras de etapa (reset de
#           otimizador Adam + reinício do scheduler cosine) SEM mudar dados,
#           regime de capacidade ou precisão. Difere de B apenas pelas 3
#           fronteiras. Se D16 ≈ B, fronteiras são baratas e o dano dos
#           protocolos CL vem da ordenação/recência; se D16 degrada, parte
#           do "custo do CL" observado era custo de fronteira.
# Orçamento: 4 × 1 época × N = 4N instâncias (igual a B com 4 épocas).
# Comparar: d16 vs b (fronteiras), d16 vs d18 (efeito de bloco)
# Ambiente: H100 80GB (1 GPU via Slurm)
# Nota:     nbits: 16 — elimina a variável de quantização NF4 presente em B
#           (que rodou QLoRA 4 bits). Se quiser isolar SÓ a fronteira, rode
#           também um B-16bits de referência; senão, D16 vs B carrega
#           {fronteiras + precisão} como diferença conjunta.
#
# VRAM (7B em 16 bits, seq 32768): pesos bf16 ≈ 15 GB + ativações com
# gradient checkpointing. Cabe na H100 80GB, mas é bem mais pesado que os
# runs 4 bits deste experimento — monitorar o pico na primeira etapa.
# Sem o pacote flash-attn instalado o fallback é 'eager' (regra anti-NaN do
# SDPA+LoRA já existente no código), o que aumenta ainda mais o pico.
# ==========================================================================

#| =========================================================================
#| MISCELÂNEA
#| =========================================================================
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/summa-experimento
    - /mnt/d/wsl_dev/llms/experimentos/summa-experimento
    - /opt/app-root/src/luiz/llms/experimentos/summa-experimento
  pastas_modelos:
    - /students/luiz.abatitucci/models
    - /mnt/d/wsl_ollama/hf-models
    - /opt/app-root/src/luiz/llms/_models

#| =========================================================================
#| CURRICULUM
#| =========================================================================
curriculum:
  saida:
    dataframe: saida/saida_or_235b.parquet
    dataframe_col: resposta
    dataframe_id: chave
    formato: json
    texto_criptografado: false

  entrada:
    dataframe: dados/integras_experimento_summa_novos.parquet
    dataset_filtro: {"fold": "<=10"}
    dataframe_col: integra
    dataframe_id: seq_documento_acordao
    prompt_template: dados/prompt_summa_raw.txt
    tag_texto: '<<--TEXTO-->>'
    texto_criptografado: false
    prompt_criptografado: false

  validacao:
    exigir_json_valido: true
    exigir_ids_pareados: false

  #| 4 etapas idênticas: mesmo arquivo, sem filtro, 1 época cada.
  #| A única variável introduzida em relação a B são as 3 fronteiras
  #| (trainer novo → otimizador zerado → scheduler reiniciado → warmup 100).
  divisao:
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b.csv
    alias: "completo-1"
    tipo: "lora"
    pace_epochs: 1
    learning_rate: 2e-05
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b.csv
    alias: "completo-2"
    tipo: "lora"
    pace_epochs: 1
    learning_rate: 2e-05
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b.csv
    alias: "completo-3"
    tipo: "lora"
    pace_epochs: 1
    learning_rate: 2e-05
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b.csv
    alias: "completo-4"
    tipo: "lora"
    pace_epochs: 1
    learning_rate: 2e-05

#| =========================================================================
#| MODELO
#| =========================================================================
modelo:
  base_model_name: Qwen2.5-7B-Instruct
  saida: treinos/Qwen2.5-7B-Instruct(d16)
  ollama: Qwen2.5-7B-Instruct(d16):latest
  ollama_base: qwen2.5:7b
  ollama_url:

#| =========================================================================
#| TREINAMENTO
#| =========================================================================
treinamento:
  flash_attention_2: true
  liger_kernel: true
  full_com_sdpa: true   # irrelevante aqui (todas as etapas são LoRA), mantido por padrão

  eval_steps: 20%

  batch_size:
    efetivo: 16
    batch_size: 1
  grad_batch_size: 8

  num_train_epochs: 4
  max_seq_length: 32768
  validar_max_seq_length: true
  filtrar_max_seq_length: true

  learning_rate: 2e-05
  max_grad_norm: 1
  save_checkpoints: true
  resume_from_checkpoint: true
  #| Warmup generoso e IDÊNTICO em todas as etapas: o custo de fronteira medido
  #| é o custo bem mitigado (recomendação ReLoRA: rampa de ~50-100 steps após
  #| reset de otimizador), não o custo de um warmup insuficiente.
  warmup_steps: 100
  weight_decay: 0.01
  optim: adamw_8bit

  lr_scheduler_type: cosine
  seed: 3407

  #| 16 bits: SEM quantização NF4. Remove por construção o erro de
  #| (de/re)quantização das fronteiras. Ver nota de VRAM no cabeçalho.
  nbits: 16

  train_on_responses_only: true

#| =========================================================================
#| LORA (Low-Rank Adaptation)
#| =========================================================================
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
