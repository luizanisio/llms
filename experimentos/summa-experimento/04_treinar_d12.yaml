# Executar com: python ../../src/treinar_unsloth.py --datasets 04_treinar_d12.yaml

# ==========================================================================
# CONFIGURAÇÃO DE TREINAMENTO - Qwen2.5-7B-Instruct (Protocolo D12)
# ==========================================================================
# Papel:   Experimental (variante granular de D4)
# Modo:    CL acumulado granular + Escalonamento LoRA→FF
# Etapas:  LoRA(≤1) → LoRA(≤2) → ... → LoRA(≤9) → FF-tudo
# Objetivo: CL com progressão suave (incremento unitário de dificuldade_int)
#           e acúmulo de dados entre etapas. Direção LoRA→FF.
#           Variação de D4 com 10 etapas em vez de 3, para avaliar se
#           uma progressão mais granular melhora o desempenho.
# Pergunta: Q5 (granularidade do currículo: progressão suave vs saltos)
# Comparar: d12 vs d4 (Q5: granularidade), d12 vs d3 (Q3+Q5), d12 vs b (Q2)
# Ambiente: H100 80GB (1 GPU via Slurm)
# ==========================================================================

misc:
  pastas_base: 
    - /students/luiz.abatitucci/llms/experimentos/summa-experimento
    - /mnt/d/wsl_dev/llms/experimentos/summa-experimento
    - /opt/app-root/src/luiz/llms/experimentos/summa-experimento
  pastas_modelos:  
    - /students/luiz.abatitucci/models
    - /mnt/d/wsl_ollama/hf-models
    - /opt/app-root/src/luiz/llms/_models

curriculum:
  saida:
    dataframe: saida/saida_or_235b.parquet
    dataframe_col: resposta
    dataframe_id: chave
    formato: json
    texto_criptografado: false

  entrada:
    dataframe: dados/integras_experimento_summa_novos.parquet
    dataset_filtro: {"fold": "<=10"}
    dataframe_col: integra
    dataframe_id: seq_documento_acordao
    prompt_template: dados/prompt_summa_raw.txt
    tag_texto: '<<--TEXTO-->>'
    texto_criptografado: false
    prompt_criptografado: false

  validacao:
    exigir_json_valido: true
    exigir_ids_pareados: false

  #| CL acumulado granular LoRA→FF: LoRA(≤1) → LoRA(≤2) → ... → LoRA(≤9) → FF-tudo
  divisao:
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b.csv
    dataset_filtro: {"dificuldade_int": "<=1"}
    alias: "f1"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b.csv
    dataset_filtro: {"dificuldade_int": "<=2"}
    alias: "f2"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b.csv
    dataset_filtro: {"dificuldade_int": "<=3"}
    alias: "f3"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b.csv
    dataset_filtro: {"dificuldade_int": "<=4"}
    alias: "f4"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b.csv
    dataset_filtro: {"dificuldade_int": "<=5"}
    alias: "f5"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b.csv
    dataset_filtro: {"dificuldade_int": "<=6"}
    alias: "f6"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b.csv
    dataset_filtro: {"dificuldade_int": "<=7"}
    alias: "f7"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b.csv
    dataset_filtro: {"dificuldade_int": "<=8"}
    alias: "f8"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b.csv
    dataset_filtro: {"dificuldade_int": "<=9"}
    alias: "f9"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: compara/analises_comparacao_summa_q235 (full-base)/divisoes/divisao_Qwen235b_Qwen7b.csv
    alias: "completo-FF"
    tipo: "full"
    learning_rate: 5e-06
    bits: 16
    pace_epochs: 2
    batch_size: 1

modelo:
  base_model_name: Qwen2.5-7B-Instruct
  saida: treinos/Qwen2.5-7B-Instruct(d12)
  ollama: Qwen2.5-7B-Instruct(d12):latest
  ollama_base: qwen2.5:7b
  ollama_url:

treinamento:
  flash_attention_2: true
  full_com_sdpa: true
  liger_kernel: true
  eval_steps: 20%
  batch_size:
    efetivo: 16
    batch_size: 1
  grad_batch_size: 8
  num_train_epochs: 4
  max_seq_length: 32768
  validar_max_seq_length: true
  filtrar_max_seq_length: true
  learning_rate: 2e-05
  save_checkpoints: true
  resume_from_checkpoint: true
  warmup_steps: 5
  weight_decay: 0.01
  optim: adamw_8bit
  lr_scheduler_type: cosine
  seed: 3407
  nbits: 4
  train_on_responses_only: true

#| =========================================================================
#| LORA (Low-Rank Adaptation)
#| =========================================================================
#| Configura a técnica de Parameter-Efficient Fine-Tuning.
lora:
  #| Dimensão da atualização de pesos. 16 é um bom balanço entre capacidade e memória.
  r: 16
  #| Fator de escala, geralmente o dobro do rank.
  alpha: 32
  dropout: 0.05

  #| Conecta os adaptadores em todas as projeções lineares para melhorar a expressividade.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
