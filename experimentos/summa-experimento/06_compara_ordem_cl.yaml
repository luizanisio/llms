# ==========================================================================
# Comparação: Direção do Currículo (Q4)
# ==========================================================================
# Propósito: Responder Q4 — a ordem fácil→difícil importa, ou basta fatiar os dados?
#   Contrasta três ordenações sobre a MESMA partição de dados, em LoRA-only:
#     crescente (CL) × decrescente (anti-CL) × aleatória (controle de bloco).
#   Comparações-chave:
#     d7 vs d9    → efeito da direção no pace por etapas disjuntas (4 bits)
#     d8 vs d10   → efeito da direção no pace acumulado (4 bits)
#     d17 vs d18  → dificuldade crescente vs terços ALEATÓRIOS, 16 bits, mesmas
#                   fronteiras e mesmo orçamento — o controle que separa
#                   "ordenar por dificuldade" de "treinar em blocos com recência"
#     d7/d8 vs b     → CL melhora sobre o baseline direto?
#     d9/d10 vs b    → anti-CL melhora sobre o baseline direto?
#     d18 vs b       → só fatiar em blocos (sem ordenar) já muda o resultado?
# Modelos: A (zero-shot), b (LoRA direto), d7/d8 (CL), d9/d10 (anti-CL),
#          d17 (CL 16b), d18 (blocos aleatórios 16b)
# NOTA: d7-d10 rodaram em LoRA 4 bits e d17/d18 em LoRA 16 bits. Comparações
#       válidas são intra-precisão (d7×d9, d8×d10, d17×d18); cruzamentos entre
#       os dois grupos carregam {ordem + quantização} como diferença conjunta.
# Executar com: python ../../src/comparar_extracoes.py --config 06_compara_ordem_cl.yaml
# ==========================================================================

# --- Miscelânea ---
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/summa-experimento
    - /mnt/d/wsl_dev/llms/experimentos/summa-experimento
    - /opt/app-root/src/luiz/llms/experimentos/summa-experimento
    - /mnt/d/wsl/llms/experimentos/summa-experimento

# Configuração Global de Saída
saida:
  pasta: "compara/analises_comparacao_summa_ordem_cl"
  pasta_parquet: "compara/"
  arquivo_base: "comparacao_summa(ordem_cl)"
  regerar_planilha_base: true
  linguagem_graficos: "en"

# Configurações de Execução
execucao:
  max_workers: 40
  teste_rapido: false
  gerar_graficos: true
  llm_as_a_judge: false
  analise_estatistica: true
  ignorar_erro_extracao: false

# Modelo Base (Gabarito/Referência)
modelo_base:
  arquivo: "saida/saida_or_235b.parquet"
  rotulo: "Qwen235b"
  alias: "Prof"
  familia: "Qwen-235B"

# Modelos Comparados
modelos_comparacao:
  # --- A: zero-shot (sem ajuste fino) ---
  - arquivo: "saida/saida_qwen7b.parquet"
    rotulo: "Qwen7B"
    alias: "A"
    familia: "Qwen-7B"
    baseline: true
  # --- B: LoRA 4b direto, dados completos (sem CL) ---
  - arquivo: "saida/saida_qwen7b(b)_teste.parquet"
    rotulo: "Qwen7B(b)"
    alias: "B"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(b)"
  # --- D7: CL por etapas, LoRA-only 4b ---
  - arquivo: "saida/saida_qwen7b(d7)_teste.parquet"
    rotulo: "Qwen7B(d7)"
    alias: "D7"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d7)"
  # --- D8: CL acumulado, LoRA-only 4b ---
  - arquivo: "saida/saida_qwen7b(d8)_teste.parquet"
    rotulo: "Qwen7B(d8)"
    alias: "D8"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d8)"
  # --- D9: Anti-CL por etapas, LoRA-only 4b ---
  - arquivo: "saida/saida_qwen7b(d9)_teste.parquet"
    rotulo: "Qwen7B(d9)"
    alias: "D9"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d9)"
  # --- D10: Anti-CL acumulado, LoRA-only 4b ---
  - arquivo: "saida/saida_qwen7b(d10)_teste.parquet"
    rotulo: "Qwen7B(d10)"
    alias: "D10"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d10)"
  # --- D17: CL por etapas, LoRA 16b (D7 sem quantização) ---
  - arquivo: "saida/saida_qwen7b(d17)_teste.parquet"
    rotulo: "Qwen7B(d17)"
    alias: "D17"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d17)"
  # --- D18: Blocos aleatórios (terços), LoRA 16b (controle de efeito de bloco) ---
  - arquivo: "saida/saida_qwen7b(d18)_teste.parquet"
    rotulo: "Qwen7B(d18)"
    alias: "D18"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d18)"

# Configuração das Métricas e Campos
configuracao_comparacao:
  padronizar_simbolos: true
  rouge_stemmer: true

  filtro:
    arquivo: "dados/divisao_Qwen235b_Qwen7b.csv"
    campo_id: "id"
    dataset_filtro: {"alvo": "teste"}

  nome_campo_id: "id"
  rotulo_campo_id: "ID"

  campos_parquet:
    id: "chave"
    resposta: "resposta"
    resumo_tokens: "resumo"
    avaliacao: ""
    erro: "erro"

  modelos:
    sbert:
      medio: "stjiris/bert-large-portuguese-cased-legal-mlm-mkd-nli-sts-v1"
    bertscore: "stjiris/bert-large-portuguese-cased-legal-mlm-mkd-nli-sts-v1"
    bertscore_batch_size: 1024
    sbert_batch_size: 1024

  mascaras:
    extracao: "^(.+)\\.json$"
    tokens: ".tokens.json"
    avaliacao: ".avaliacao.json"
    observabilidade: ".obs.json"

  # Configuração das análises estatísticas (Friedman, Wilcoxon, Nemenyi, etc.)
  # Sem este bloco o padrao seria apenas "(global)"; os agregados Likert e
  # MetaDados sao os alvos de interesse para as comparacoes pareadas.
  campos_estatisticas:
    campos:
      - "(global)"
      - "Likert"
      - "MetaDados"
    metricas:
      - bertscore
      - sbert_medio
      - sbert_grande

  campos:
    bertscore:
      - "(global)"
      - "Materia"
      - "Dispositivo"
      - "Temas"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

    rouge_1:

    rouge_2:
      - "Partes"
      - "Partes.Tipo"
      - "Partes.Nome"

    rouge_l:
      - "Materia"
      - "Dispositivo"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

    levenshtein:
      - "Tipo"
      - "DataJulgamento"

    sbert_medio:
      - "(global)"
      - "Materia"
      - "Dispositivo"
      - "Temas"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

    sbert_grande:
      - "(global)"
      - "Materia"
      - "Dispositivo"
      - "Temas"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

campos_virtuais:
  Likert:
    - Materia
    - Temas.Ponto
    - Temas.Argumentos
    - Temas.Doutrina
    - Temas.Conceitos
    - Resumo
  MetaDados:
    - Partes.Tipo
    - Partes.Nome
    - Temas.Normas
    - Temas.Jurisprudencia
