# ==========================================================================
# Configuração do Juiz LLM — Avaliação de Extrações SUMMA
# Executar com: python ../../../src/util_vllm_batch.py --config 02_extracao_70.yaml
# Visualizar com: python ../../../src/util_vllm_batch.py --config 02_extracao_70.yaml --view
# ==========================================================================
#
# IMPORTANTE: Antes de executar este YAML, gere o parquet de entrada com:
#   python gerar_entrada_juiz_llm.py
#
# O script gera 210 linhas (70 docs × 3 modelos), onde cada linha já contém
# o prompt completo do juiz LLM (template + acórdão + extração formatada).
# ==========================================================================

#| =========================================================================
#| MISCELÂNEA
#| =========================================================================
misc:
  pastas_base: 
    - /students/luiz.abatitucci/llms/experimentos/summa-experimento/avaliacao_llm_humana
    - /mnt/d/wsl_dev/llms/experimentos/summa-experimento/avaliacao_llm_humana
    - /mnt/c/wsl_git/gitluiz/llms/experimentos/summa-experimento/avaliacao_llm_humana
    - /opt/app-root/src/luiz/llms/experimentos/summa-experimento/avaliacao_llm_humana
  pastas_modelos:  
    - /students/luiz.abatitucci/models
    - /mnt/d/wsl_ollama/hf-models
    - /opt/app-root/src/luiz/llms/_models

# --- Modelo ---
modelo:
  #caminho: "oa:gpt5:h:l"
  #caminho: "oa:gpt5-chat:m:l"
  #caminho: "mt:sabia-4"
  # S5: ":m:l" = reasoning_effort medium (verbosity "l" é ignorada pela Maritaca),
  # mesmo nível dos juízes GPT-5 (oa:gpt5:m:l). Sem o sufixo a API usa xhigh.
  # temperature é ignorada (S5 só aceita 1) — ver aviso no log.
  caminho: "mt:S5-free:m:l"
  #caminho: "or:nvidia/nemotron-3-ultra-550b-a55b"
  #caminho: "or:z-ai/glm-5.2"
  #caminho: "tg:zai-org/GLM-5.2"
  #caminho: "tg:MiniMaxAI/MiniMax-M3"
  lora: ""

# --- Parâmetros de Geração ---
# Resposta esperada: JSON compacto {"nota": int, "problemas": [...]}
# temperature baixa para avaliação determinística/consistente
geracao:
  # tokens de raciocínio contam; teto alto para não cortar o JSON (S5 gera até 64K).
  # GPT-5 medium usou ~2.5–3.5K por item. Reduza para modelos com contexto pequeno.
  max_tokens: 32768
  temperature: 0.01
  top_k: 2
  top_p: 0.9
  batch_size: 20
  tentativas: 20      # tentativas de extração (em caso de erro, tenta novamente apenas para os que tiveram falha)
  pausa_tentativas: 5 # pausa em segundos antes de uma nova tentativa

# --- Entrada ---
# O parquet de entrada já contém o prompt completo na coluna 'texto'.
# Não é necessário prompt_template nem system_prompt.
entrada:
  arquivo: "./dados/entrada_juiz_llm.parquet"
  campo_chave: "chave"
  campo_texto: "texto"
  prompt_template: ""
  variavel_texto: ""
  system_prompt: ""

# --- Saída ---
# tipo_saida: json — parseia automaticamente a resposta como JSON
saida:
  arquivo: "./saida_sabia5_03/saida_juiz_llm.parquet"
  tipo_saida: "json"
