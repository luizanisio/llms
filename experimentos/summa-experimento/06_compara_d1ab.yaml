      - "Materia"
      - "Dispositivo"
      - "Temas"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

    rouge_1:

    rouge_2:
      - "Partes"
      - "Partes.Tipo"
      - "Partes.Nome"

    rouge_l:
      - "Materia"
      - "Dispositivo"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

    levenshtein:
      - "Tipo"
      - "DataJulgamento"

    sbert_medio:
      - "(global)"
      - "Materia"
      - "Dispositivo"
      - "Temas"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

    sbert_grande:
      - "(global)"
      - "Materia"
      - "Dispositivo"
      - "Temas"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

campos_virtuais:
  Likert:
    - Materia
    - Temas.Ponto
    - Temas.Argumentos
    - Temas.Doutrina
    - Temas.Conceitos
    - Resumo
  MetaDados:
    - Partes.Tipo
    - Partes.Nome
    - Temas.Normas
    - Temas.Jurisprudencia


# ==========================================================================
# Estatística — camada frequentista + camada bayesiana
# ==========================================================================
# Frequentista (Friedman → Wilcoxon com Holm → Nemenyi/CD): diz SE existe
#   diferença entre os protocolos.
# Bayesiana (baycomp.CorrelatedTTest — analítico, sem amostragem nem semente):
#   diz O QUANTO acreditar — P(A > B) e P(equivalência prática dentro da ROPE).
#   Aqui "equivalente" é um achado, e "inconclusivo" é um desfecho legítimo.
# As duas camadas usam os mesmos recortes de `protocolos`.
# Saída: compara/analises_comparacao_summa_d1ab/estatisticas/ e .../bayesiana/
# Reexecutar só esta etapa (não refaz a comparação pesada):
#   python ../../src/comparar_extracoes.py --config 06_compara_d1ab.yaml --estatisticas
# ==========================================================================

estatistica:
  frequentista: true     # Friedman, Wilcoxon (Holm), Nemenyi e CD diagram
  bayesiana: true        # heatmaps de P(A > B) e P(equivalência), relatório bayesiano
  limiar: 0.95           # probabilidade mínima para decidir um par;
                         #   abaixo disso o par sai como "inconclusivo"
  incluir_base: false    # ignorado quando `protocolos` é um dicionário
  rope_likert: 0.01      # margem sobre as NOTAS do juiz LLM (obrigatória > 0).
                         #   Só tem efeito quando campos_parquet.avaliacao aponta
                         #   para as avaliações — hoje vazio, então a seção Likert
                         #   é omitida e só as métricas automáticas rodam.
  # Bateria de CALIBRAÇÃO: D1/D1a/D1b são réplicas do MESMO protocolo (mesmos
  # dados, mesmos hiperparâmetros), então toda diferença entre elas é ruído.
  # Só com esta marca o pipeline gera `estatisticas/00_rope_sugerido.md`, cujos
  # valores são transcritos para a ROPE dos YAMLs de comparação entre protocolos.
  # Em comparações entre protocolos distintos o mesmo cálculo somaria efeito real
  # ao ruído e inflaria a ROPE — por isso a marca fica só aqui.
  calibracao_rope: true

  # Um único recorte: as três réplicas, todas contra todas.
  protocolos:
    Panorama_Geral: "TODOS"

  # --- Métricas automáticas (camada COMPLEMENTAR) ---
  # Medem similaridade com o modelo base = FIDELIDADE DE DESTILAÇÃO, não
  # qualidade: quem copia fielmente um erro do professor é premiado por elas.
  # Servem para triangular, nunca como veredito.
  metricas_automaticas:
    # ROPE = margem de empate sobre os ESCORES BRUTOS: |x - y| <= rope é empate.
    # Obrigatória (> 0) e decisiva — pequena demais pinta o heatmap de
    # vencedores/perdedores, grande demais deixa tudo empatado. A varredura de
    # sensibilidade (rope/2, rope, 2·rope) é calculada automaticamente por campo.
    # Aqui a ROPE é só o valor EM TESTE: a sugestão do relatório vem dos dados e
    # do `limiar`, não deste número. Ciclo de calibração:
    #   1) rodar com qualquer valor > 0;
    #   2) transcrever os valores de `estatisticas/00_rope_sugerido.md`;
    #   3) rodar de novo — a calibração está confirmada quando todos os pares de
    #      réplicas saem como "equivalentes".
    # `rope` é o fallback dos campos não listados em `rope_por_campo`.
    rope: 0.0118
    rope_por_campo:
      Likert: 0.0108
      MetaDados: 0.0118

    # Likert e MetaDados são os alvos de interesse das comparações pareadas.
    campos:
      - "Likert"
      - "MetaDados"
    metricas:
      - bertscore
      - sbert_medio
      - rouge_l
