# ==========================================================================
# Comparação: Consistência do Protocolo D1 (Réplicas D1, D1a, D1b)
# ==========================================================================
# Propósito: Medir a variância não-determinística do treinamento.
#   Três réplicas idênticas do protocolo D1 (mesmos hiperparâmetros, mesmo seed),
#   variando apenas o diretório de saída, para quantificar a estabilidade dos
#   resultados frente ao não-determinismo do hardware/framework.
#   Comparações-chave:
#     D1 vs D1a vs D1b → variância entre réplicas (consistência)
# Modelos: D1 (réplica 1), D1a (réplica 2), D1b (réplica 3)
# Executar com: python ../../src/comparar_extracoes.py --config 06_compara_d1ab.yaml
# ==========================================================================

# --- Miscelânea ---
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/summa-experimento
    - /mnt/d/wsl_dev/llms/experimentos/summa-experimento
    - /opt/app-root/src/luiz/llms/experimentos/summa-experimento
    - /mnt/d/wsl/llms/experimentos/summa-experimento

# Configuração Global de Saída
saida:
  pasta: "compara/analises_comparacao_summa_d1ab"
  pasta_parquet: "compara/"
  arquivo_base: "comparacao_summa(d1ab)"
  regerar_planilha_base: true
  linguagem_graficos: "en"

# Configurações de Execução
execucao:
  max_workers: 40
  teste_rapido: false
  gerar_graficos: true
  llm_as_a_judge: false
  analise_estatistica: true
  ignorar_erro_extracao: false

# Modelo Base (Gabarito/Referência)
modelo_base:
  arquivo: "saida/saida_or_235b.parquet"
  rotulo: "Qwen235b"
  alias: "Prof"
  familia: "Qwen-235B"

# Modelos Comparados
modelos_comparacao:
  # --- D1: Réplica 1 (original) ---
  - arquivo: "saida/saida_qwen7b(d1)_teste.parquet"
    rotulo: "Qwen7B(d1)"
    alias: "D1"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d1)"
  # --- D1a: Réplica 2 ---
  - arquivo: "saida/saida_qwen7b(d1a)_teste.parquet"
    rotulo: "Qwen7B(d1a)"
    alias: "D1a"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d1a)"
  # --- D1b: Réplica 3 ---
  - arquivo: "saida/saida_qwen7b(d1b)_teste.parquet"
    rotulo: "Qwen7B(d1b)"
    alias: "D1b"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d1b)"

# Configuração das Métricas e Campos
configuracao_comparacao:
  padronizar_simbolos: true
  rouge_stemmer: true

  filtro:
    arquivo: "dados/divisao_Qwen235b_Qwen7b.csv"
    campo_id: "id"
    dataset_filtro: {"alvo": "teste"}

  nome_campo_id: "id"
  rotulo_campo_id: "ID"

  campos_parquet:
    id: "chave"
    resposta: "resposta"
    resumo_tokens: "resumo"
    avaliacao: ""
    erro: "erro"

  modelos:
    sbert:
      medio: "stjiris/bert-large-portuguese-cased-legal-mlm-mkd-nli-sts-v1"
    bertscore: "stjiris/bert-large-portuguese-cased-legal-mlm-mkd-nli-sts-v1"
    bertscore_batch_size: 1024
    sbert_batch_size: 1024

  mascaras:
    extracao: "^(.+)\\.json$"
    tokens: ".tokens.json"
    avaliacao: ".avaliacao.json"
    observabilidade: ".obs.json"

  # Configuração das análises estatísticas (Friedman, Wilcoxon, Nemenyi, etc.)
  campos_estatisticas:
    campos:
      - "(global)"
      - "Likert"
      - "MetaDados"
    metricas:
      - bertscore
      - sbert_medio
      - sbert_grande

  campos:
    bertscore:
      - "(global)"
      - "Materia"
      - "Dispositivo"
      - "Temas"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

    rouge_1:

    rouge_2:
      - "Partes"
      - "Partes.Tipo"
      - "Partes.Nome"

    rouge_l:
      - "Materia"
      - "Dispositivo"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

    levenshtein:
      - "Tipo"
      - "DataJulgamento"

    sbert_medio:
      - "(global)"
      - "Materia"
      - "Dispositivo"
      - "Temas"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

    sbert_grande:
      - "(global)"
      - "Materia"
      - "Dispositivo"
      - "Temas"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

campos_virtuais:
  Likert:
    - Materia
    - Temas.Ponto
    - Temas.Argumentos
    - Temas.Doutrina
    - Temas.Conceitos
    - Resumo
  MetaDados:
    - Partes.Tipo
    - Partes.Nome
    - Temas.Normas
    - Temas.Jurisprudencia
