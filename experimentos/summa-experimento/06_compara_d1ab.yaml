    rotulo: "Qwen7B(d1)"
    alias: "D1"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d1)"
  # --- D1a: Réplica 2 ---
  - arquivo: "saida/saida_qwen7b(d1a)_teste.parquet"
