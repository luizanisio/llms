# Executar com: python ../../src/treinar_unsloth.py --treinar 04_treinar_d17.yaml
# Executar com: python ../../src/treinar_unsloth.py --datasets 04_treinar_d17.yaml

# ==========================================================================
# CONFIGURAÇÃO DE TREINAMENTO - Qwen2.5-7B-Instruct (Protocolo D17)
# ==========================================================================
# Papel:   Experimental (CL puro no regime LoRA, sem quantização)
# Modo:    LoRA 16 bits + CL por dificuldade
# Etapas:  fácil → médio → difícil → completo (2 épocas cada)
# Objetivo: Refazer o D7 (CL-LoRA) removendo a variável de quantização NF4.
#           Comparado ao D16 (mesmas 3 fronteiras, mesmo warmup, mesma
#           precisão, mesmo orçamento), a ÚNICA diferença é a composição dos
#           dados por etapa — teste limpo de "a ordenação curricular ajuda?".
# Orçamento: (fácil+médio+difícil = N) × 2 + completo N × 2 = 4N instâncias.
# Comparar: d17 vs d16 (ordenação com fronteiras controladas),
#           d17 vs d18 (dificuldade vs blocos aleatórios), d17 vs d7 (efeito do 4-bit)
# Ambiente: H100 80GB (1 GPU via Slurm)
# Nota VRAM: ver cabeçalho do D16 (7B em 16 bits com seq 32768).
# ==========================================================================

#| =========================================================================
#| MISCELÂNEA
#| =========================================================================
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/summa-experimento
    - /mnt/d/wsl_dev/llms/experimentos/summa-experimento
    - /opt/app-root/src/luiz/llms/experimentos/summa-experimento
  pastas_modelos:
    - /students/luiz.abatitucci/models
    - /mnt/d/wsl_ollama/hf-models
    - /opt/app-root/src/luiz/llms/_models

#| =========================================================================
#| CURRICULUM
#| =========================================================================
curriculum:
  saida:
    dataframe: saida/saida_or_235b.parquet
    dataframe_col: resposta
    dataframe_id: chave
    formato: json
    texto_criptografado: false

  entrada:
    dataframe: dados/integras_experimento_summa_novos.parquet
    dataset_filtro: {"fold": "<=10"}
    dataframe_col: integra
    dataframe_id: seq_documento_acordao
    prompt_template: dados/prompt_summa_raw.txt
    tag_texto: '<<--TEXTO-->>'
    texto_criptografado: false
    prompt_criptografado: false

  validacao:
    exigir_json_valido: true
    exigir_ids_pareados: false

  #| CL clássico por dificuldade, TODAS as etapas em LoRA 16 bits:
  #| nenhuma troca de técnica ou de precisão em nenhuma fronteira.
  divisao:
  - arquivo: dados/divisao_Qwen235b_Qwen7b.csv
    dataset_filtro: {"dificuldade": "facil"}
    alias: "fácil"
    tipo: "lora"
    pace_epochs: 2
    learning_rate: 2e-05
  - arquivo: dados/divisao_Qwen235b_Qwen7b.csv
    dataset_filtro: {"dificuldade": "medio"}
    alias: "médio"
    tipo: "lora"
    pace_epochs: 2
    learning_rate: 2e-05
  - arquivo: dados/divisao_Qwen235b_Qwen7b.csv
    dataset_filtro: {"dificuldade": "dificil"}
    alias: "difícil"
    tipo: "lora"
    pace_epochs: 2
    learning_rate: 2e-05
  - arquivo: dados/divisao_Qwen235b_Qwen7b.csv
    alias: "completo"
    tipo: "lora"
    pace_epochs: 2
    learning_rate: 2e-05

#| =========================================================================
#| MODELO
#| =========================================================================
modelo:
  base_model_name: Qwen2.5-7B-Instruct
  saida: treinos/Qwen2.5-7B-Instruct(d17)
  ollama: Qwen2.5-7B-Instruct(d17):latest
  ollama_base: qwen2.5:7b
  ollama_url:

#| =========================================================================
#| TREINAMENTO
#| =========================================================================
treinamento:
  flash_attention_2: true
  liger_kernel: true
  full_com_sdpa: true   # irrelevante aqui (todas as etapas são LoRA), mantido por padrão

  eval_steps: 20%

  batch_size:
    efetivo: 16
    batch_size: 1
  grad_batch_size: 8

  num_train_epochs: 4
  max_seq_length: 32768
  validar_max_seq_length: true
  filtrar_max_seq_length: true

  learning_rate: 2e-05
  max_grad_norm: 1
  save_checkpoints: true
  resume_from_checkpoint: true
  warmup_steps: 100          # Idêntico a D16/D18 — fronteiras comparáveis
  weight_decay: 0.01
  optim: adamw_8bit

  lr_scheduler_type: cosine
  seed: 3407

  nbits: 16                  # Sem NF4: mesma precisão de D16/D18

  train_on_responses_only: true

#| =========================================================================
#| LORA (Low-Rank Adaptation)
#| =========================================================================
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
