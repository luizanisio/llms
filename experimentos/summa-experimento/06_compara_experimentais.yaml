# ==========================================================================
# Comparação: Experimento Principal (Q1 + Q2 + Q3 + Q5)
# ==========================================================================
# Propósito: Responder as perguntas de pesquisa com os protocolos centrais
#   (todos SEGMENTADOS — uma execução de trainer por etapa).
#   Q1 — Efeito do ajuste fino: A vs {b, c, d1..d4, d11, d12}
#   Q2 — Efeito do CL: {b, c} vs {d1, d2, d3, d4}
#   Q3 — Direção do escalonamento: d1 vs d2, d3 vs d4, d11 vs d12
#   Q5 — Pace do currículo (progressão suave vs saltos): d11 vs d3, d12 vs d4
#   Complementar: d1/d2 (etapas disjuntas) vs d3/d4 (acumulado com replay)
# Modelos: A (zero-shot), b (LoRA), c (FF), d1-d4 (CL+escalonamento), d11-d12 (granulares)
# Ver também: 06_compara_ordem_pt (Q3 completa), 06_compara_ordem_cl (Q4),
#             06_compara_ablacoes (isolamento), 06_compara_fronteiras (Q6)
# Executar com: python ../../src/comparar_extracoes.py --config 06_compara_experimentais.yaml
# ==========================================================================

# --- Miscelânea ---
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/summa-experimento
    - /mnt/d/wsl_dev/llms/experimentos/summa-experimento
    - /opt/app-root/src/luiz/llms/experimentos/summa-experimento
    - /mnt/d/wsl/llms/experimentos/summa-experimento

# Configuração Global de Saída
saida:
  pasta: "compara/analises_comparacao_summa_experimentais"
  pasta_parquet: "compara/"
  arquivo_base: "comparacao_summa(experimentais)"
  regerar_planilha_base: true
  linguagem_graficos: "en"

# Configurações de Execução
execucao:
  max_workers: 40
  teste_rapido: false
  gerar_graficos: true
  llm_as_a_judge: false
  analise_estatistica: true
  ignorar_erro_extracao: false

# Modelo Base (Gabarito/Referência)
modelo_base:
  arquivo: "saida/saida_or_235b.parquet"
  rotulo: "Qwen235b"
  alias: "Prof"
  familia: "Qwen-235B"

# Modelos Comparados
modelos_comparacao:
  # --- A: zero-shot (sem ajuste fino) ---
  - arquivo: "saida/saida_qwen7b.parquet"
    rotulo: "Qwen7B"
    alias: "A"
    familia: "Qwen-7B"
    baseline: true
  # --- B: LoRA 4b direto, dados completos (sem CL) ---
  - arquivo: "saida/saida_qwen7b(b)_teste.parquet"
    rotulo: "Qwen7B(b)"
    alias: "B"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(b)"
  # --- C: Full FT 16b direto, dados completos (sem CL) ---
  - arquivo: "saida/saida_qwen7b(c)_teste.parquet"
    rotulo: "Qwen7B(c)"
    alias: "C"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(c)"
  # --- D1: CL por etapas + escalonamento FF→LoRA ---
  - arquivo: "saida/saida_qwen7b(d1)_teste.parquet"
    rotulo: "Qwen7B(d1)"
    alias: "D1"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d1)"
  # --- D2: CL por etapas + escalonamento LoRA→FF ---
  - arquivo: "saida/saida_qwen7b(d2)_teste.parquet"
    rotulo: "Qwen7B(d2)"
    alias: "D2"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d2)"
  # --- D3: CL acumulado (3 etapas) + escalonamento FF→LoRA ---
  - arquivo: "saida/saida_qwen7b(d3)_teste.parquet"
    rotulo: "Qwen7B(d3)"
    alias: "D3"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d3)"
  # --- D4: CL acumulado (3 etapas) + escalonamento LoRA→FF ---
  - arquivo: "saida/saida_qwen7b(d4)_teste.parquet"
    rotulo: "Qwen7B(d4)"
    alias: "D4"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d4)"
  # --- D11: CL acumulado granular (10 etapas) + FF→LoRA ---
  - arquivo: "saida/saida_qwen7b(d11)_teste.parquet"
    rotulo: "Qwen7B(d11)"
    alias: "D11"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d11)"
  # --- D12: CL acumulado granular (10 etapas) + LoRA→FF ---
  - arquivo: "saida/saida_qwen7b(d12)_teste.parquet"
    rotulo: "Qwen7B(d12)"
    alias: "D12"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d12)"

# Configuração das Métricas e Campos
configuracao_comparacao:
  padronizar_simbolos: true
  rouge_stemmer: true

  filtro:
    arquivo: "dados/divisao_Qwen235b_Qwen7b.csv"
    campo_id: "id"
    dataset_filtro: {"alvo": "teste"}

  nome_campo_id: "id"
  rotulo_campo_id: "ID"

  campos_parquet:
    id: "chave"
    resposta: "resposta"
    resumo_tokens: "resumo"
    avaliacao: ""
    erro: "erro"

  modelos:
    sbert:
      medio: "stjiris/bert-large-portuguese-cased-legal-mlm-mkd-nli-sts-v1"
    bertscore: "stjiris/bert-large-portuguese-cased-legal-mlm-mkd-nli-sts-v1"
    bertscore_batch_size: 1024
    sbert_batch_size: 1024

  mascaras:
    extracao: "^(.+)\\.json$"
    tokens: ".tokens.json"
    avaliacao: ".avaliacao.json"
    observabilidade: ".obs.json"

  # Configuração das análises estatísticas (Friedman, Wilcoxon, Nemenyi, etc.)
  # Sem este bloco o padrao seria apenas "(global)"; os agregados Likert e
  # MetaDados sao os alvos de interesse para as comparacoes pareadas.
  campos_estatisticas:
    campos:
      - "(global)"
      - "Likert"
      - "MetaDados"
    metricas:
      - bertscore
      - sbert_medio
      - sbert_grande

  campos:
    bertscore:
      - "(global)"
      - "Materia"
      - "Dispositivo"
      - "Temas"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

    rouge_1:

    rouge_2:
      - "Partes"
      - "Partes.Tipo"
      - "Partes.Nome"

    rouge_l:
      - "Materia"
      - "Dispositivo"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

    levenshtein:
      - "Tipo"
      - "DataJulgamento"

    sbert_medio:
      - "(global)"
      - "Materia"
      - "Dispositivo"
      - "Temas"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

    sbert_grande:
      - "(global)"
      - "Materia"
      - "Dispositivo"
      - "Temas"
      - "Temas.Ponto"
      - "Temas.Argumentos"
      - "Temas.Doutrina"
      - "Temas.Conceitos"
      - "Temas.Explicacao"
      - "Resumo"
      - "Likert"
      - "MetaDados"

campos_virtuais:
  Likert:
    - Materia
    - Temas.Ponto
    - Temas.Argumentos
    - Temas.Doutrina
    - Temas.Conceitos
    - Resumo
  MetaDados:
    - Partes.Tipo
    - Partes.Nome
    - Temas.Normas
    - Temas.Jurisprudencia
