# 08_baseline_clinicalnerpt.yaml — configuração do baseline externo
#
# Cada modelo clinicalnerpt-* do HAILab-PUCPR (BioBERTpt) é um sequence
# labeler especializado em UM tipo de entidade ou grupo semântico.
# Este script roda cada modelo sobre o split de teste do SemClinBr e
# compara os resultados (Micro F1 e Mediana) em uma tabela invertida contra todos os nossos protocolos.

corpus:
  xml: "dados/SemClinBr-xml-public-v1"
  divisao: "dados/divisao_Gold_Qwen7B.csv"
  split: "teste"
  semgroups: ""

# Modelos baseline do HuggingFace (HAILab-PUCPR)
modelos_baseline:
  - nome: "pucpr/clinicalnerpt-pharmacologic"
    coluna: "Farmaco (STY)"
    escopo: "STY"
    alvo: "Pharmacologic Substance"

  - nome: "pucpr/clinicalnerpt-chemical"
    coluna: "Quimicos (SGR)"
    escopo: "SGR"
    alvo: "Chemicals & Drugs"

  - nome: "pucpr/clinicalnerpt-disease"
    coluna: "Doenca (STY)"
    escopo: "STY"
    alvo: "Disease or Syndrome"

  - nome: "pucpr/clinicalnerpt-disorder"
    coluna: "Desordens (SGR)"
    escopo: "SGR"
    alvo: "Disorders"

  - nome: "pucpr/clinicalnerpt-diagnostic"
    coluna: "Diag. (STY)"
    escopo: "STY"
    alvo: "Diagnostic Procedure"

  - nome: "pucpr/clinicalnerpt-medical"
    coluna: "Dispositivo (STY)"
    escopo: "STY"
    alvo: "Medical Device"

# Protocolos nossos para comparação direta nas mesmas entidades
protocolos:
  - arquivo: "saidas/saida_semclinbr_7b.parquet"
    alias: "A"
  - arquivo: "saidas/saida_semclinbr_7b(b)_teste.parquet"
    alias: "B"
  - arquivo: "saidas/saida_semclinbr_7b(b16)_teste.parquet"
    alias: "B16"
  - arquivo: "saidas/saida_semclinbr_7b(b16r8)_teste.parquet"
    alias: "B16R8"
  - arquivo: "saidas/saida_semclinbr_7b(c)_teste.parquet"
