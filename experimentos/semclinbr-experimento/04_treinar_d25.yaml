# Executar com: python ../../src/treinar_unsloth.py --treinar 04_treinar_d25.yaml
# Executar com: python ../../src/treinar_unsloth.py --datasets 04_treinar_d25.yaml

# ==========================================================================
# CONFIGURAÇÃO DE TREINAMENTO - Qwen 2.5 7B (Protocolo D25)
# ==========================================================================
# Papel:   Controle comparativo do D24 (full 16 bits vs LoRA 4 bits)
# Modo:    FUSÃO: Full FT 16 bits, CL acumulado granular por spans + PT por
#          gating de LR em passos de 10%, em um ÚNICO trainer.train()
# Spans:   ≤1(uf 90%) → ≤2(uf 80%) → ... → ≤9(uf 10%) → tudo(uf 0%)
# Objetivo: Mesma topologia de dados e capacidade do D24, mas em regime full
#           16 bits em vez de LoRA 4 bits. Isola a variável "regime de treino"
#           dado o mesmo currículo granular fundido:
#           - d25 vs d24: efeito do regime (full 16b vs LoRA 4b) dado CL+PT
#             granular fundido. Mais capacidade expressiva (pesos plenos vs
#             adapters de posto baixo), porém custo de VRAM ~4× maior.
#           - d25 vs d12: full fundido vs LoRA segmentado (mesmos dados).
#             Se d25 > d12: tanto a eliminação de fronteiras quanto o regime
#             full contribuem; d25 vs d24 separa os dois efeitos.
#           - d25 vs d22: granularidade 10 vs 4, ambos fundidos com gating;
#             d25 é full e d22 é LoRA, mas a granularidade é a variável
#             primária nesta comparação.
# Perguntas: Q6 (fronteira), Q8 (regime full vs LoRA no contexto fundido),
#            sinergia CL+PT no regime full 16 bits.
# Ambiente: H100 80GB (1 GPU via Slurm)
# Requisito: código com suporte ao modo FUSÃO + gating de LR por grupos
#
# DIFERENÇAS CHAVE EM RELAÇÃO AO D24 (LoRA 4 bits):
# 1. Regime: Full FT 16 bits → todos os pesos treináveis (vs adapters LoRA).
#    O gating controla LR por grupo de CAMADAS PLENAS (não adapters).
# 2. Bits: 16 → sem quantização NF4, mais precisão numérica.
# 3. VRAM: pico ~4× maior (pesos + gradientes + Adam em 16/8 bits para
#    todos os parâmetros). Viável na H100 80GB para o 7B.
# 4. LR: 5e-06 (vs 2e-05 do D24) — full FT exige LR menor para
#    estabilidade (mais parâmetros recebendo gradiente).
# 5. max_grad_norm: 0.3 (vs 1.0 do D24) — estabiliza blocos recém-acordados
#    com momentos Adam zerados no regime full.
# 6. lora.r: 0 → garante tipo_padrao = "full" caso alguma etapa omita 'tipo'.
#
# PROGRESSÃO DE CAPACIDADE — idêntica ao D24:
#   Span   Dados   unfreeze   Grupo    Blocos liberados    Acumulado
#   f1     ≤1      90%        G1       25-27 + cabeça      3 blocos
#   f2     ≤2      80%        G2       22-24               6 blocos
#   f3     ≤3      70%        G3       19-21               9 blocos
#   f4     ≤4      60%        G4       16-18               12 blocos
#   f5     ≤5      50%        G5       13-15               15 blocos
#   f6     ≤6      40%        G6       10-12               18 blocos
#   f7     ≤7      30%        G7       7-9                 21 blocos
#   f8     ≤8      20%        G8       4-6                 24 blocos
#   f9     ≤9      10%        G9       1-3                 27 blocos
#   all    tudo    0%         G10      0 + embeddings      28 blocos
#
# ORÇAMENTO DE DADOS: idêntico ao D24 e D12.
# ==========================================================================

#| =========================================================================
#| MISCELÂNEA
#| =========================================================================
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/semclibr-experimento
    - /mnt/d/wsl_dev/llms/experimentos/semclibr-experimento
    - /opt/app-root/src/luiz/llms/experimentos/semclibr-experimento
  pastas_modelos:
    - /students/luiz.abatitucci/models
    - /students/luiz.abatitucci/llms/experimentos/semclibr-experimento/treinos
    - /mnt/d/wsl_dev/llms/experimentos/semclibr-experimento/treinos
    - /mnt/d/wsl_ollama/hf-models
    - /opt/app-root/src/luiz/llms/_models
#| =========================================================================
#| CURRICULUM
#| =========================================================================
curriculum:
  saida:
    dataframe: saidas/saida_semclinbr_gold.parquet
    dataframe_col: resposta
    dataframe_id: chave
    formato: json
    texto_criptografado: false

  entrada:
    dataframe: dados/semclinbr.parquet
    dataframe_col: texto
    dataframe_id: id
    prompt_template: dados/prompt_semclinbr.txt
    tag_texto: '<<--TEXTO-->>'
    texto_criptografado: false
    prompt_criptografado: false

  validacao:
    exigir_json_valido: true
    exigir_ids_pareados: false

  #| FUSÃO: parâmetros globais do run único
  #| Regime Full FT 16 bits com gating granular — 10 grupos de camadas.
  #| LR base menor que o D24 (5e-06 vs 2e-05): full FT com muitos
  #| parâmetros exige LR conservadora para estabilidade.
  fusao:
    ativo: true
    tipo: "full"              # gating sobre pesos plenos (não adapters)
    learning_rate: 5e-06      # pico único do cosine global (full FT)
    warmup_grupo_steps: 100   # rampa de cada grupo ao acordar (0 → cosine atual)
    seed_shuffle: 3407

  #| CL acumulado granular com gating de capacidade em passos de 10%.
  #| Mesma progressão de dados do D24/D12 (dificuldade_int ≤1...≤9, tudo),
  #| mas aqui cada span libera 10% a mais das CAMADAS PLENAS via gating.
  divisao:
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=1"}
    alias: "f1-uf90"
    pace_epochs: 2
    unfreeze_layers_from: 90%   # G1 ativo do step 0: blocos 25-27 + cabeça/norm
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=2"}
    alias: "f2-uf80"
    pace_epochs: 2
    unfreeze_layers_from: 80%   # G2 acorda aqui: blocos 22-24
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=3"}
    alias: "f3-uf70"
    pace_epochs: 2
    unfreeze_layers_from: 70%   # G3 acorda aqui: blocos 19-21
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=4"}
    alias: "f4-uf60"
    pace_epochs: 2
    unfreeze_layers_from: 60%   # G4 acorda aqui: blocos 16-18
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=5"}
    alias: "f5-uf50"
    pace_epochs: 2
    unfreeze_layers_from: 50%   # G5 acorda aqui: blocos 13-15
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=6"}
    alias: "f6-uf40"
    pace_epochs: 2
    unfreeze_layers_from: 40%   # G6 acorda aqui: blocos 10-12
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=7"}
    alias: "f7-uf30"
    pace_epochs: 2
    unfreeze_layers_from: 30%   # G7 acorda aqui: blocos 7-9
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=8"}
    alias: "f8-uf20"
    pace_epochs: 2
    unfreeze_layers_from: 20%   # G8 acorda aqui: blocos 4-6
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=9"}
    alias: "f9-uf10"
    pace_epochs: 2
    unfreeze_layers_from: 10%   # G9 acorda aqui: blocos 1-3
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    alias: "completo-uf0"
    pace_epochs: 2
    unfreeze_layers_from: 0%    # G10 acorda aqui: bloco 0 + embeddings/lm_head

#| =========================================================================
#| MODELO
#| =========================================================================
modelo:
  base_model_name: Qwen2.5-7B-Instruct
  saida: treinos/Qwen2.5-7B-Instruct(d25)
  ollama: Qwen2.5-7B-Instruct(d25):latest
  ollama_base: qwen2.5:7b
  ollama_url:

#| =========================================================================
#| TREINAMENTO
#| =========================================================================
treinamento:
  flash_attention_2: true
  liger_kernel: true
  full_com_sdpa: true          # Full FT em todo o run → SDPA liberado com segurança

  #| 5% → alta resolução para capturar os 10 marcadores virtuais
  eval_steps: 5%

  #| ATENÇÃO: `efetivo` MANDA. _aplicar_batch_size_auto (src/treinar_unsloth_util.py)
  #| recalcula grad_batch_size = efetivo / (batch_size x n_gpus) e SOBRESCREVE o valor
  #| escrito abaixo. Com efetivo=16 e batch_size=1 em 1 GPU, o acúmulo real é 16.
  batch_size:
    efetivo: 16
    batch_size: 1
  grad_batch_size: 16

  #| IGNORADO no modo fundido (1 época real sobre o stream concatenado)
  num_train_epochs: 4
  max_seq_length: 12288
  validar_max_seq_length: true
  #| Remove os exemplos que ultrapassam o limite (esperado: nenhum, o corpus cabe em 12288)
  filtrar_max_seq_length: true

  #| Sobrescrito por fusao.learning_rate; mantido igual para documentação.
  learning_rate: 5e-06
  #| max_grad_norm apertado: estabiliza blocos recém-acordados com momentos
  #| Adam zerados no regime full (diagnosticado nos protocolos D19/D20).
  max_grad_norm: 0.3
  save_checkpoints: true
  resume_from_checkpoint: true
  warmup_steps: 100            # warmup GLOBAL (rampa do G1, sempre ativo)
  weight_decay: 0.01
  optim: adamw_8bit

  lr_scheduler_type: cosine    # UM ciclo; gates multiplicam o envelope por grupo
  seed: 3407

  #| Full FT: sempre 16 bits — sem quantização em nenhum ponto do run.
  nbits: 16

  train_on_responses_only: true

#| =========================================================================
#| LORA — NÃO UTILIZADO (regime full)
#| =========================================================================
#| r: 0 garante tipo_padrao = "full" caso alguma etapa omita 'tipo'.
lora:
  r: 0
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
