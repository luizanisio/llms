# ==========================================================================
# Configuração para inferência em lote com vLLM — Protocolo A (zero-shot)
# Executar com: python ../../src/util_vllm_batch.py --config 02_semclinbr_1_5b.yaml
# Executar com: python ../../src/util_vllm_batch.py --config 02_semclinbr_1_5b.yaml --view
# ==========================================================================
# Roda o Qwen2.5-1.5B-Instruct SEM ajuste fino sobre o corpus INTEIRO (sem filtro
# de split). O corpus inteiro é necessário porque o passo 03 usa esta saída para
# calibrar a dificuldade de cada documento, e o currículo do passo 04 precisa
# dessa dificuldade nos documentos de treino — não só nos de teste.
# O recorte de teste desta mesma saída é o que entra em 06 como baseline A.
# ==========================================================================

# --- Miscelânea ---
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/semclibr-experimento
    - /mnt/d/wsl_dev/llms/experimentos/semclibr-experimento
    - /opt/app-root/src/luiz/llms/experimentos/semclibr-experimento
  pastas_modelos:
    - /students/luiz.abatitucci/models
    - /mnt/d/wsl_ollama/hf-models
    - /opt/app-root/src/luiz/llms/_models

# --- Modelo ---
# caminho: caminho para modelo HuggingFace (local ou hub)
# lora: caminho para adaptador LoRA treinado (opcional, deixe vazio se não usar)
modelo:
  caminho: "Qwen2.5-1.5B-Instruct"
  lora: ""

# --- Configuração do vLLM ---
# max_model_len: medido no corpus com o tokenizador do Qwen2.5-1.5B —
#   prompt + texto: máx. 2.425 tokens (p99 = 1.423)
#   resposta gold:  máx. 7.581 tokens (p99 = 4.633)
#   total:          máx. 10.006 tokens
#   12288 cobre 100% dos 1.000 documentos; 2.425 + max_tokens 8192 = 10.617.
vllm:
  gpu_memory_utilization: 0.90
  max_model_len: 12288
  tensor_parallel_size: 1
  dtype: "auto"

# --- Parâmetros de Geração ---
# temperature/top_k quase determinísticos: a tarefa é extração, não geração.
geracao:
  max_tokens: 8192
  temperature: 0.01
  top_k: 2
  top_p: 0.9
  batch_size: 5
  tentativas: 20      # tentativas de extração (em caso de erro, tenta novamente apenas para os que tiveram falha)
  pausa_tentativas: 5 # pausa em segundos antes de uma nova tentativa

# --- Entrada ---
# Sem `filtro`: o passo 03 precisa dos 1.000 documentos para calibrar a dificuldade.
entrada:
  arquivo: "dados/semclinbr.parquet"
  campo_chave: "id"
  campo_texto: "texto"
  prompt_template: "dados/prompt_semclinbr.txt"
  variavel_texto: "<<--TEXTO-->>"
  system_prompt: "You are an expert clinical annotator."

# --- Saída ---
# Retomada: ao reiniciar, itens já processados com sucesso são ignorados.
saida:
  arquivo: "saidas/saida_semclinbr_1_5b.parquet"
  tipo_saida: "json"
