# ==========================================================================
# Comparação: Consistência do Protocolo D1 (Réplicas D1, D1a, D1b)
# ==========================================================================
# Propósito: Medir a variância não-determinística do treinamento.
#   Três réplicas idênticas do protocolo D1 (mesmos hiperparâmetros, mesmo seed),
#   variando apenas o diretório de saída, para quantificar a estabilidade dos
#   resultados frente ao não-determinismo do hardware/framework.
#   Comparações-chave:
#     D1 vs D1a vs D1b → variância entre réplicas (consistência)
# Modelos: D1 (réplica 1), D1a (réplica 2), D1b (réplica 3)
# Executar com: python ../../src/comparar_extracoes.py --config 06_compara_d1ab.yaml
# ==========================================================================

# --- Miscelânea ---
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/semclinbr-experimento
    - /mnt/d/wsl_dev/llms/experimentos/semclinbr-experimento
    - /opt/app-root/src/luiz/llms/experimentos/semclinbr-experimento

# Configuração Global de Saída
saida:
  pasta: "compara/analises_comparacao_semclinbr_d1ab"
  pasta_parquet: "compara/"
  arquivo_base: "comparacao_semclinbr(d1ab)"
  regerar_planilha_base: true
  linguagem_graficos: "en"

# Configurações de Execução
execucao:
  max_workers: 20
  teste_rapido: false
  llm_as_a_judge: false
  ignorar_erro_extracao: false

# Modelo Base (Gabarito/Referência)
modelo_base:
  arquivo: "saidas/saida_semclinbr_gold.parquet"
  rotulo: "Gold"
  familia: "SemClinBR-Gold"

# Modelos Comparados
modelos_comparacao:
  # --- D1: Réplica 1 (original) ---
  - arquivo: "saidas/saida_semclinbr_7b(d1)_teste.parquet"
    rotulo: "Qwen7B(d1)"
    alias: "D1"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d1)"
  # --- D1a: Réplica 2 ---
  - arquivo: "saidas/saida_semclinbr_7b(d1a)_teste.parquet"
    rotulo: "Qwen7B(d1a)"
    alias: "D1a"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d1a)"
  # --- D1b: Réplica 3 ---
  - arquivo: "saidas/saida_semclinbr_7b(d1b)_teste.parquet"
    rotulo: "Qwen7B(d1b)"
    alias: "D1b"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d1b)"

# Configuração das Métricas e Campos
configuracao_comparacao:
  padronizar_simbolos: true
  rouge_stemmer: true

  filtro:
    arquivo: "dados/semclinbr.parquet"
    campo_id: "id"
    dataset_filtro: {"split": "teste"}

  nome_campo_id: "id"
  rotulo_campo_id: "ID"

  campos_parquet:
    id: "chave"
    resposta: "resposta"
    #resumo_tokens: "resumo"
    avaliacao: ""
    erro: "erro"

  # (Opcional) Sobrescrita de modelos HF para BERTScore
  modelos:

  mascaras:
    extracao: "^(.+)\\.json$"
    tokens: ".tokens.json"
    avaliacao: ".avaliacao.json"
    observabilidade: ".obs.json"

  # ========================================================================
  # Mapeamento de campos para métricas
  # ------------------------------------------------------------------------
  # Esquema da resposta: {"entities": [{id, text, tag, abbr}],
  #                       "relations": [{annotation1, annotation2, reltype}]}
  #
  # `entities.id`, `relations.annotation1` e `relations.annotation2` ficam de
  # FORA de propósito: são inteiros sequenciais e, depois do alinhamento húngaro
  # que util_json aplica às listas, não correspondem entre gabarito e predição.
  # Compará-los mediria o ruído da ordenação, não a qualidade da extração.
  # Idêntico ao bloco de 03_compara_gold_full.yaml — a dificuldade que ordena o
  # currículo e a avaliação final precisam sair da mesma régua.
  # ========================================================================
  campos:
    rouge_1:

    rouge_2:
      - "(global)"
      - "entities"
      - "entities.text"
      - "entities.tag"
      - "entities.abbr"
      - "relations"
      - "relations.reltype"
      - "Entidades"
      - "Relacoes"

    rouge_l:
      - "(global)"
      - "entities"
      - "entities.text"
      - "entities.tag"
      - "entities.abbr"
      - "relations"
      - "relations.reltype"
      - "Entidades"
      - "Relacoes"

campos_virtuais:
  Entidades:
    - entities.text
    - entities.tag
    - entities.abbr
  Relacoes:
    - relations.reltype


# ==========================================================================
# Estatística — camada frequentista + camada bayesiana
# ==========================================================================
# Frequentista (Friedman → Wilcoxon com Holm → Nemenyi/CD): diz SE existe
#   diferença entre os protocolos.
# Bayesiana (baycomp.CorrelatedTTest — analítico, sem amostragem nem semente):
#   diz O QUANTO acreditar — P(A > B) e P(equivalência prática dentro da ROPE).
#   Aqui "equivalente" é um achado, e "inconclusivo" é um desfecho legítimo.
# As duas camadas usam os mesmos recortes de `protocolos`.
# Saída: compara/analises_comparacao_semclinbr_d1ab/estatisticas/ e .../bayesiana/
# Reexecutar só esta etapa (não refaz a comparação pesada):
#   python ../../src/comparar_extracoes.py --config 06_compara_d1ab.yaml --estatisticas
# ==========================================================================

estatistica:
  frequentista: true     # Friedman, Wilcoxon (Holm), Nemenyi e CD diagram
  bayesiana: true        # heatmaps de P(A > B) e P(equivalência), relatório bayesiano
  limiar: 0.95           # probabilidade mínima para decidir um par;
                         #   abaixo disso o par sai como "inconclusivo"
  incluir_base: false    # ignorado quando `protocolos` é um dicionário
  # Bateria de CALIBRAÇÃO: D1/D1a/D1b são réplicas do MESMO protocolo (mesmos
  # dados, mesmos hiperparâmetros), então toda diferença entre elas é ruído.
  # Só com esta marca o pipeline gera `estatisticas/00_rope_sugerido.md`, cujos
  # valores são transcritos para a ROPE dos YAMLs de comparação entre protocolos.
  # Em comparações entre protocolos distintos o mesmo cálculo somaria efeito real
  # ao ruído e inflaria a ROPE — por isso a marca fica só aqui.
  calibracao_rope: true

  # Um único recorte: as três réplicas, todas contra todas.
  protocolos:
    Panorama_Geral: "TODOS"

  # --- Métricas automáticas (camada COMPLEMENTAR) ---
  # Medem similaridade com o modelo base = FIDELIDADE DE DESTILAÇÃO, não
  # qualidade: quem copia fielmente um erro do professor é premiado por elas.
  # Servem para triangular, nunca como veredito.
  metricas_automaticas:
    # ROPE = margem de empate sobre os ESCORES BRUTOS: |x - y| <= rope é empate.
    # Obrigatória (> 0) e decisiva — pequena demais pinta o heatmap de
    # vencedores/perdedores, grande demais deixa tudo empatado. A varredura de
    # sensibilidade (rope/2, rope, 2·rope) é calculada automaticamente por campo.
    # Aqui a ROPE é só o valor EM TESTE: a sugestão do relatório vem dos dados e
    # do `limiar`, não deste número. Ciclo de calibração:
    #   1) rodar com qualquer valor > 0;
    #   2) transcrever os valores de `estatisticas/00_rope_sugerido.md`;
    #   3) rodar de novo — a calibração está confirmada quando todos os pares de
    #      réplicas saem como "equivalentes".
    # `rope` é o fallback dos campos não listados em `rope_por_campo`.
    rope: 0.01               # PROVISÓRIO — substituir pelo valor sugerido
    # rope_por_campo:        # transcrever de 00_rope_sugerido.md
    #   (global): 0.0000
    #   Entidades: 0.0000
    #   Relacoes: 0.0000

    # Entidades e Relacoes são os alvos de interesse; (global) fica como âncora.
    campos:
      - "(global)"
      - "Entidades"
      - "Relacoes"
    metricas:
      - rouge_l
      - rouge_2
