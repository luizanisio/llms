# Executar com: python ../../src/treinar_unsloth.py --treinar 04_treinar_d14.yaml
# Executar com: python ../../src/treinar_unsloth.py --datasets 04_treinar_d14.yaml

# ==========================================================================
# CONFIGURAÇÃO DE TREINAMENTO - Qwen 2.5 7B (Protocolo D14)
# ==========================================================================
# Papel:   Experimental (PT + CL sem escalonamento)
# Modo:    PT LoRA completo + CL por etapas FF-only
# Etapas:  LoRA-completo → FF-fácil → FF-médio → FF-difícil → FF-completo
# Objetivo: Avaliar se um pré-treino LoRA com o dataset completo antes do
#           curriculum learning melhora o desempenho. Combina warm-up LoRA
#           (4 epochs) seguido do CL puro do D13 (FF por dificuldade).
# Pergunta: Q6 (pré-treino LoRA + CL puro melhora o resultado?)
# Comparar: d14 vs d13 (efeito do PT), d14 vs b (PT+CL vs baseline)
# Ambiente: H100 80GB (1 GPU via Slurm)
# ==========================================================================

#| =========================================================================
#| MISCELÂNEA
#| =========================================================================
#| Configurações diversas (logs, variáveis de ambiente).
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/semclibr-experimento
    - /mnt/d/wsl_dev/llms/experimentos/semclibr-experimento
    - /opt/app-root/src/luiz/llms/experimentos/semclibr-experimento
  pastas_modelos:
    - /students/luiz.abatitucci/models
    - /students/luiz.abatitucci/llms/experimentos/semclibr-experimento/treinos
    - /mnt/d/wsl_dev/llms/experimentos/semclibr-experimento/treinos
    - /mnt/d/wsl_ollama/hf-models
    - /opt/app-root/src/luiz/llms/_models
#| =========================================================================
#| CURRICULUM
#| =========================================================================
#| Cada etapa corresponde a uma divisão do dataset com parâmetros de treino.
#| O campo 'arquivo' é o CSV de divisão (equivalente a pastas.divisao.arquivo).
curriculum:
  #| Saida: Especifica o "Gold Dataset", ou seja, os resultados esperados no gabarito
  saida:
    dataframe: saidas/saida_semclinbr_gold.parquet
    dataframe_col: resposta
    dataframe_id: chave
    formato: json
    texto_criptografado: false

  #| Entrada: Especifica os dados que o modelo vai receber como prompt
  entrada:
    dataframe: dados/semclinbr.parquet
    dataframe_col: texto
    dataframe_id: id
    prompt_template: dados/prompt_semclinbr.txt
    tag_texto: '<<--TEXTO-->>'
    texto_criptografado: false
    prompt_criptografado: false

  validacao:
    exigir_json_valido: true
    exigir_ids_pareados: false

  #| Divisao: Define as etapas do treinamento (o currículo em si)
  #| CL + PT por etapas completo LoRA -> FF-only: completo LoRA -> fácil-FF → médio-FF → difícil-FF → completo-FF
  divisao:
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    alias: "completo"
    tipo: "lora"
    pace_epochs: 4
    batch_size: 1
    learning_rate: 2e-05
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade": "facil"}
    alias: "fácil-FF"
    tipo: "full"
    pace_epochs: 2
    batch_size: 1
    learning_rate: 5e-06 # Padrão para Full FT
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade": "medio"}
    alias: "médio-FF"
    tipo: "full"
    pace_epochs: 2
    batch_size: 1
    learning_rate: 5e-06 # Padrão para Full FT
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade": "dificil"}
    alias: "difícil-FF"
    tipo: "full"
    pace_epochs: 2
    batch_size: 1
    learning_rate: 5e-06 # Padrão para Full FT
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    alias: "completo-FF"
    tipo: "full"
    pace_epochs: 2
    batch_size: 1
    learning_rate: 5e-06 # Padrão para Full FT

#| =========================================================================
#| MODELO
#| =========================================================================
modelo:
  base_model_name: Qwen2.5-7B-Instruct
  saida: treinos/Qwen2.5-7B-Instruct(d14)
  ollama: Qwen2.5-7B-Instruct(d14):latest
  ollama_base: qwen2.5:7b
  ollama_url:

#| =========================================================================
#| TREINAMENTO
#| =========================================================================
treinamento:
  flash_attention_2: true
  liger_kernel: true
  full_com_sdpa: true

  eval_steps: 20%

  #| ATENÇÃO: `efetivo` MANDA. _aplicar_batch_size_auto (src/treinar_unsloth_util.py)
  #| recalcula grad_batch_size = efetivo / (batch_size x n_gpus) e SOBRESCREVE o valor
  #| escrito abaixo. Com efetivo=16 e batch_size=1 em 1 GPU, o acúmulo real é 16.
  batch_size:
    efetivo: 16
    batch_size: 1
  grad_batch_size: 16

  num_train_epochs: 4
  max_seq_length: 12288
  validar_max_seq_length: true
  #| Remove os exemplos que ultrapassam o limite (esperado: nenhum, o corpus cabe em 12288)
  filtrar_max_seq_length: true

  learning_rate: 2e-05
  max_grad_norm: 1
  save_checkpoints: true
  resume_from_checkpoint: true
  warmup_steps: 5
  weight_decay: 0.01
  optim: adamw_8bit

  lr_scheduler_type: cosine
  seed: 3407

  nbits: 4

  train_on_responses_only: true

#| =========================================================================
#| LORA (Low-Rank Adaptation)
#| =========================================================================
#| Configura a técnica de Parameter-Efficient Fine-Tuning.
lora:
  #| Dimensão da atualização de pesos. 16 é um bom balanço entre capacidade e memória.
  r: 16
  #| Fator de escala, geralmente o dobro do rank.
  alpha: 32
  dropout: 0.05

  #| Conecta os adaptadores em todas as projeções lineares para melhorar a expressividade.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
