# ==========================================================================
# Comparação: Direção do Escalonamento de Capacidade (Q3)
# ==========================================================================
# Propósito: Responder Q3 — FF→LoRA e LoRA→FF produzem desempenhos distintos?
#   Cobre a pergunta nos dois regimes de dados: COM CL (d1-d4) e SEM CL (d5, d6).
#   Comparações-chave (direção, pareadas):
#     d1 vs d2    → direção com CL por etapas disjuntas
#     d3 vs d4    → direção com CL acumulado
#     d5 vs d6    → direção sem CL (controle limpo do eixo PT)
#   Comparações de suporte (o escalonamento vale o custo?):
#     d5 vs c / d5 vs b → FF→LoRA melhora sobre o treino direto?
#     d6 vs c / d6 vs b → LoRA→FF melhora sobre o treino direto?
#     d1 vs d5 / d2 vs d6 → o CL adiciona valor dado a mesma direção de escalonamento?
# Modelos: A (zero-shot), b (LoRA), c (FF), d1-d4 (com CL), d5-d6 (sem CL)
# Ver também: 06_compara_capacidade — a mesma pergunta para o eixo PT
#             implementado DENTRO da parametrização (unfreeze/gating, d19-d23, d25)
# Executar com: python ../../src/comparar_extracoes.py --config 06_compara_ordem_pt.yaml
# ==========================================================================

# --- Miscelânea ---
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/semclibr-experimento
    - /mnt/d/wsl_dev/llms/experimentos/semclibr-experimento
    - /opt/app-root/src/luiz/llms/experimentos/semclibr-experimento

# Configuração Global de Saída
saida:
  pasta: "compara/analises_comparacao_semclinbr_ordem_pt"
  pasta_parquet: "compara/"
  arquivo_base: "comparacao_semclinbr(ordem_pt)"
  regerar_planilha_base: true
  linguagem_graficos: "en"

# Configurações de Execução
execucao:
  max_workers: 20
  teste_rapido: false
  llm_as_a_judge: false
  ignorar_erro_extracao: false

# Modelo Base (Gabarito/Referência)
modelo_base:
  arquivo: "saidas/saida_semclinbr_gold.parquet"
  rotulo: "Gold"
  familia: "SemClinBR-Gold"

# Modelos Comparados
modelos_comparacao:
  # --- A: zero-shot (sem ajuste fino) ---
  - arquivo: "saidas/saida_semclinbr_7b.parquet"
    rotulo: "Qwen7B"
    alias: "A"
    familia: "Qwen-7B"
    baseline: true
  # --- B: LoRA 4b direto, dados completos (sem CL) ---
  - arquivo: "saidas/saida_semclinbr_7b(b)_teste.parquet"
    rotulo: "Qwen7B(b)"
    alias: "B"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(b)"
  # --- C: Full FT 16b direto, dados completos (sem CL) ---
  - arquivo: "saidas/saida_semclinbr_7b(c)_teste.parquet"
    rotulo: "Qwen7B(c)"
    alias: "C"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(c)"
  # --- D1: CL por etapas + escalonamento FF→LoRA ---
  - arquivo: "saidas/saida_semclinbr_7b(d1)_teste.parquet"
    rotulo: "Qwen7B(d1)"
    alias: "D1"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d1)"
  # --- D2: CL por etapas + escalonamento LoRA→FF ---
  - arquivo: "saidas/saida_semclinbr_7b(d2)_teste.parquet"
    rotulo: "Qwen7B(d2)"
    alias: "D2"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d2)"
  # --- D3: CL acumulado (3 etapas) + escalonamento FF→LoRA ---
  - arquivo: "saidas/saida_semclinbr_7b(d3)_teste.parquet"
    rotulo: "Qwen7B(d3)"
    alias: "D3"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d3)"
  # --- D4: CL acumulado (3 etapas) + escalonamento LoRA→FF ---
  - arquivo: "saidas/saida_semclinbr_7b(d4)_teste.parquet"
    rotulo: "Qwen7B(d4)"
    alias: "D4"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d4)"
  # --- D5: Escalonamento FF→LoRA sem CL (dados completos) ---
  - arquivo: "saidas/saida_semclinbr_7b(d5)_teste.parquet"
    rotulo: "Qwen7B(d5)"
    alias: "D5"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d5)"
  # --- D6: Escalonamento LoRA→FF sem CL (dados completos) ---
  - arquivo: "saidas/saida_semclinbr_7b(d6)_teste.parquet"
    rotulo: "Qwen7B(d6)"
    alias: "D6"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d6)"

# Configuração das Métricas e Campos
configuracao_comparacao:
  padronizar_simbolos: true
  rouge_stemmer: true

  filtro:
    arquivo: "dados/semclinbr.parquet"
    campo_id: "id"
    dataset_filtro: {"split": "teste"}

  nome_campo_id: "id"
  rotulo_campo_id: "ID"

  campos_parquet:
    id: "chave"
    resposta: "resposta"
    resumo_tokens: "resumo"
    avaliacao: ""
    erro: "erro"

  # (Opcional) Sobrescrita de modelos HF para BERTScore
  modelos:

  mascaras:
    extracao: "^(.+)\\.json$"
    tokens: ".tokens.json"
    avaliacao: ".avaliacao.json"
    observabilidade: ".obs.json"

  # Configuração das análises estatísticas (Friedman, Wilcoxon, Nemenyi, etc.)
  campos_estatisticas:
    campos:
      - "(global)"
      - "Entidades"
      - "Relacoes"
    metricas:
      - rouge_l
      - rouge_2

  # ========================================================================
  # Mapeamento de campos para métricas
  # ------------------------------------------------------------------------
  # Esquema da resposta: {"entities": [{id, text, tag, abbr}],
  #                       "relations": [{annotation1, annotation2, reltype}]}
  #
  # `entities.id`, `relations.annotation1` e `relations.annotation2` ficam de
  # FORA de propósito: são inteiros sequenciais e, depois do alinhamento húngaro
  # que util_json aplica às listas, não correspondem entre gabarito e predição.
  # Compará-los mediria o ruído da ordenação, não a qualidade da extração.
  # Idêntico ao bloco de 03_compara_gold_full.yaml — a dificuldade que ordena o
  # currículo e a avaliação final precisam sair da mesma régua.
  # ========================================================================
  campos:
    rouge_1:

    rouge_2:
      - "(global)"
      - "entities"
      - "entities.text"
      - "entities.tag"
      - "entities.abbr"
      - "relations"
      - "relations.reltype"
      - "Entidades"
      - "Relacoes"

    rouge_l:
      - "(global)"
      - "entities"
      - "entities.text"
      - "entities.tag"
      - "entities.abbr"
      - "relations"
      - "relations.reltype"
      - "Entidades"
      - "Relacoes"

campos_virtuais:
  Entidades:
    - entities.text
    - entities.tag
    - entities.abbr
  Relacoes:
    - relations.reltype
