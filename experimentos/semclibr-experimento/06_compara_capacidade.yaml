# Configuração Global de Saída
saida:
  pasta: "compara/analises_comparacao_semclinbr_capacidade"
  pasta_parquet: "compara/"
  arquivo_base: "comparacao_semclinbr(capacidade)"
  regerar_planilha_base: true
  linguagem_graficos: "en"

# Configurações de Execução
execucao:
  max_workers: 20
  teste_rapido: false
  llm_as_a_judge: false
  ignorar_erro_extracao: false

# Modelo Base (Gabarito/Referência)
modelo_base:
  arquivo: "saidas/saida_semclinbr_gold.parquet"
  rotulo: "Gold"
  familia: "SemClinBR-Gold"

# Modelos Comparados
modelos_comparacao:
  # --- A: zero-shot (sem ajuste fino) ---
  - arquivo: "saidas/saida_semclinbr_7b.parquet"
    rotulo: "Qwen7B"
    alias: "A"
    familia: "Qwen-7B"
    baseline: true
  # --- B: LoRA 4b r=16 direto, dados completos (sem CL) ---
  - arquivo: "saidas/saida_semclinbr_7b(b)_teste.parquet"
    rotulo: "Qwen7B(b)"
    alias: "B"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(b)"
  # --- C: Full FT 16b direto, dados completos (sem CL) ---
  - arquivo: "saidas/saida_semclinbr_7b(c)_teste.parquet"
    rotulo: "Qwen7B(c)"
    alias: "C"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(c)"
  # --- D13: CL por etapas, FF-only 16b ---
  - arquivo: "saidas/saida_semclinbr_7b(d13)_teste.parquet"
    rotulo: "Qwen7B(d13)"
    alias: "D13"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d13)"
  # --- D17: CL por etapas, LoRA 16b (D7 sem quantização) ---
  - arquivo: "saidas/saida_semclinbr_7b(d17)_teste.parquet"
    rotulo: "Qwen7B(d17)"
    alias: "D17"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d17)"
  # --- D19: CL por etapas + unfreeze progressivo, FF 16b ---
  - arquivo: "saidas/saida_semclinbr_7b(d19)_teste.parquet"
    rotulo: "Qwen7B(d19)"
    alias: "D19"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d19)"
  # --- D20: Sem CL + unfreeze progressivo, FF 16b (dados completos) ---
  - arquivo: "saidas/saida_semclinbr_7b(d20)_teste.parquet"
    rotulo: "Qwen7B(d20)"
    alias: "D20"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d20)"
  # --- D21: FUSÃO: CL por etapas, LoRA 16b, fronteiras virtuais (espelho do D17) ---
  - arquivo: "saidas/saida_semclinbr_7b(d21)_teste.parquet"
    rotulo: "Qwen7B(d21)"
    alias: "D21"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d21)"
  # --- D22: FUSÃO: CL por etapas + gating de LR por camada, LoRA 16b ---
  - arquivo: "saidas/saida_semclinbr_7b(d22)_teste.parquet"
    rotulo: "Qwen7B(d22)"
    alias: "D22"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d22)"
  # --- D23: FUSÃO: gating de LR sem CL (dados completos), LoRA 16b ---
  - arquivo: "saidas/saida_semclinbr_7b(d23)_teste.parquet"
    rotulo: "Qwen7B(d23)"
    alias: "D23"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d23)"
  # --- D24: FUSÃO: CL granular (10 spans) + gating 10%, LoRA 4b (espelho do D12) ---
  - arquivo: "saidas/saida_semclinbr_7b(d24)_teste.parquet"
    rotulo: "Qwen7B(d24)"
    alias: "D24"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d24)"
  # --- D25: FUSÃO: CL granular (10 spans) + gating 10%, Full FT 16b ---
  - arquivo: "saidas/saida_semclinbr_7b(d25)_teste.parquet"
    rotulo: "Qwen7B(d25)"
    alias: "D25"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d25)"

# Configuração das Métricas e Campos
configuracao_comparacao:
  padronizar_simbolos: true
  rouge_stemmer: true

  filtro:
    arquivo: "dados/semclinbr.parquet"
    campo_id: "id"
    dataset_filtro: {"split": "teste"}

  nome_campo_id: "id"
  rotulo_campo_id: "ID"

  campos_parquet:
    id: "chave"
    resposta: "resposta"
    resumo_tokens: "resumo"
    avaliacao: ""
    erro: "erro"

  # (Opcional) Sobrescrita de modelos HF para BERTScore
  modelos:
    # Alternativa para pt-br clínico. Trocar exige rodar 03 E 06 com o mesmo
    # modelo, senão a dificuldade e a avaliação final ficam em escalas distintas.
    #bertscore: "pucpr/biobertpt-all"
    bertscore_batch_size: 1024

  mascaras:
    extracao: "^(.+)\\.json$"
    tokens: ".tokens.json"
    avaliacao: ".avaliacao.json"
    observabilidade: ".obs.json"

  # Configuração das análises estatísticas (Friedman, Wilcoxon, Nemenyi, etc.)
  campos_estatisticas:
    campos:
      - "(global)"
      - "Entidades"
      - "Relacoes"
    metricas:
      - bertscore
      - rouge_l
      - rouge_2

  # ========================================================================
  # Mapeamento de campos para métricas
  # ------------------------------------------------------------------------
  # Esquema da resposta: {"entities": [{id, text, tag, abbr}],
  #                       "relations": [{annotation1, annotation2, reltype}]}
  #
  # `entities.id`, `relations.annotation1` e `relations.annotation2` ficam de
  # FORA de propósito: são inteiros sequenciais e, depois do alinhamento húngaro
  # que util_json aplica às listas, não correspondem entre gabarito e predição.
  # Compará-los mediria o ruído da ordenação, não a qualidade da extração.
  # Idêntico ao bloco de 03_compara_gold_full.yaml — a dificuldade que ordena o
  # currículo e a avaliação final precisam sair da mesma régua.
  # ========================================================================
  campos:
    bertscore:
      - "(global)"
      - "entities"
      - "entities.text"
      - "Entidades"
      - "Relacoes"

    rouge_1:

    rouge_2:
      - "(global)"
      - "entities"
      - "entities.text"
      - "entities.tag"
      - "entities.abbr"
      - "relations"
      - "relations.reltype"
      - "Entidades"
      - "Relacoes"

    rouge_l:
      - "(global)"
      - "entities"
      - "entities.text"
      - "entities.tag"
      - "entities.abbr"
      - "relations"
      - "relations.reltype"
      - "Entidades"
      - "Relacoes"

campos_virtuais:
  Entidades:
    - entities.text
    - entities.tag
    - entities.abbr
  Relacoes:
    - relations.reltype
