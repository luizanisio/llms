# ==========================================================================
# Comparação: Eixo PT sem Troca de Regime — unfreeze e gating (Q7)
# ==========================================================================
# Propósito: Avaliar a segunda instanciação do eixo PT do framework, na qual a
#   capacidade cresce DENTRO da mesma parametrização — sem merge LoRA, sem
#   requantização, sem troca de espaço de busca. Duas implementações:
#     - descongelamento progressivo de blocos (segmentado, full 16b): d19, d20
#     - gating de LR por grupo de camadas (fundido, otimizador contínuo):
#       d22, d23 (granularidade 4) e d24, d25 (granularidade 10)
#
#   Fecha o 2×2 {CL, ¬CL} × {PT, ¬PT} em cada implementação:
#     unfreeze:  d19 (CL+PT) × d20 (PT) × d13 (CL) × c  (nenhum)
#     gating:    d22 (CL+PT) × d23 (PT) × d21 (CL) × b  (nenhum)
#
#   Comparações-chave:
#     d20 vs c    → unfreeze progressivo puro melhora sobre FF direto?
#     d19 vs d20  → o CL adiciona valor DADO o unfreeze? (tese central: sinergia)
#     d19 vs d13  → o PT adiciona valor DADO o CL FF-only?
#     d23 vs b    → gating puro (PT fundido) já compete com o treino direto?
#     d22 vs d23  → o CL adiciona valor DADO o gating?
#     d22 vs d21  → o gating adiciona valor DADO o CL fundido?
#     d24 vs d22  → granularidade do gating: 10 grupos vs 4 (ambos LoRA fundidos;
#                   ressalva: d24 roda 4 bits e d22 roda 16 bits)
#     d25 vs d24  → regime full vs LoRA com a mesma progressão de capacidade
#     d19 vs d25  → as duas formas de PT em regime full: congelamento REAL
#                   (com fronteiras) vs gating de LR (fundido, sem fronteiras)
#
#   Leitura esperada: d19 > d20 > c e d22 > d23 > b sustentam a sinergia CL+PT;
#   d19 ≈ d20 (ou d22 ≈ d23) indicaria que o ganho é do escalonamento de
#   capacidade e que o CL é passageiro.
#
# Modelos: A, b, c, d13, d17, d19, d20, d21, d22, d23, d24, d25
# NOTA (Qwen 2.5 7B, 28 blocos): os cortes 75/50/25/0% resolvem para os grupos
#   de camadas 21-27 / 14-20 / 7-13 / 0-6, com cabeça+norm no primeiro grupo;
#   nos protocolos granulares (d24/d25) os passos de 10% resolvem para 10
#   grupos de 3 blocos.
# NOTA: gating NÃO é congelamento — em d22-d25 todos os grupos estão no
#   otimizador desde o step 0 (LR 0 até acordarem), sem economia de VRAM;
#   em d19/d20 os blocos congelados ficam fora do otimizador.
# LIMITAÇÃO a registrar: d23 usa 1 época por span (dados completos) e d22 usa 2
#   (fatias), para equalizar o orçamento em 4N — os steps de ativação dos grupos
#   caem em posições diferentes do stream nos dois protocolos.
# Executar com: python ../../src/comparar_extracoes.py --config 06_compara_capacidade.yaml
# ==========================================================================

