# ==========================================================================
# Comparação: Custo de Fronteira e de Transição de Regime (Q6)
# ==========================================================================
# Propósito: Responder Q6 — há perda de eficiência ao transitar entre etapas
#   LoRA/Full e durante a progressão de dificuldade?
#   A pergunta tem duas metades, e este relatório cobre as duas:
#
#   (a) TRANSIÇÃO DE REGIME (LoRA ↔ Full): o merge/requantização entre etapas
#       custa qualidade?
#         d5 vs c, d5 vs b → FF→LoRA contra os diretos (sem CL, sem confundir com dados)
#         d6 vs c, d6 vs b → LoRA→FF contra os diretos
#         d25 vs d24       → mesma topologia fundida, full 16b vs LoRA 4b
#
#   (b) FRONTEIRA DE ETAPA (reset do otimizador Adam + reinício do cosine),
#       mesmo sem mudar regime nem dados:
#         d16 vs b16  → FRONTEIRA PURA: b16 é a execução única em LoRA 16b r=16,
#                       exatamente a configuração do d16 sem as 3 fronteiras.
#                       Este é o par correto (d16 vs b carregaria também a
#                       quantização, pois b roda NF4 — ver 06_compara_controle_b).
#         d17 vs d16  → ordenação curricular com fronteiras controladas
#         d18 vs d16  → efeito de bloco sem ordenação
#         d21 vs d17  → MEDIDA MAIS LIMPA: mesma progressão de dados, mesma
#                       precisão, mesmo orçamento — fronteiras VIRTUAIS (fusão)
#                       vs REAIS (segmentado). Diferença = custo de fronteira.
#         d24 vs d12  → mesma leitura na granularidade 10 (CL acumulado unitário)
#         d24 vs d21  → granularidade 10 vs 4 DENTRO do modo fundido
#
#   Leitura esperada: se d21 > d17 e d24 > d12, parte do "custo do CL" medido
#   nos protocolos segmentados era custo de fronteira, não da ordenação.
#
# Modelos: A, b, b16, c, d5, d6, d12, d16, d17, d18, d21, d24, d25
# NOTA: as curvas de treino (pasta_treinamento → training_metrics.jsonl) são a
#       evidência primária desta pergunta — observar o spike de loss em cada
#       fronteira dos segmentados e sua ausência nos fundidos (d21-d25).
# Executar com: python ../../src/comparar_extracoes.py --config 06_compara_fronteiras.yaml
# ==========================================================================

# --- Miscelânea ---
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/semclibr-experimento
    - /mnt/d/wsl_dev/llms/experimentos/semclibr-experimento
