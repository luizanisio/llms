# ==========================================================================
# Comparação: Experimento Principal (Q1 + Q2 + Q3 + Q5)
# ==========================================================================
# Propósito: Responder as perguntas de pesquisa com os protocolos centrais
#   (todos SEGMENTADOS — uma execução de trainer por etapa).
#   Q1 — Efeito do ajuste fino: A vs {b, c, d1..d4, d11, d12}
#   Q2 — Efeito do CL: {b, c} vs {d1, d2, d3, d4}
#   Q3 — Direção do escalonamento: d1 vs d2, d3 vs d4, d11 vs d12
#   Q5 — Pace do currículo (progressão suave vs saltos): d11 vs d3, d12 vs d4
#   Complementar: d1/d2 (etapas disjuntas) vs d3/d4 (acumulado com replay)
# Modelos: A (zero-shot), b (LoRA), c (FF), d1-d4 (CL+escalonamento), d11-d12 (granulares)
# Ver também: 06_compara_ordem_pt (Q3 completa), 06_compara_ordem_cl (Q4),
#             06_compara_ablacoes (isolamento), 06_compara_fronteiras (Q6)
# Executar com: python ../../src/comparar_extracoes.py --config 06_compara_experimentais.yaml
# Executar com: python ../../src/comparar_extracoes.py --config 06_compara_experimentais.yaml --bayesiana
# ==========================================================================

# --- Miscelânea ---
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/semclibr-experimento
    - /mnt/d/wsl_dev/llms/experimentos/semclibr-experimento
    - /opt/app-root/src/luiz/llms/experimentos/semclibr-experimento

# Configuração Global de Saída
saida:
  pasta: "compara/analises_comparacao_semclinbr_experimentais"
  pasta_parquet: "compara/"
  arquivo_base: "comparacao_semclinbr(experimentais)"
  regerar_planilha_base: true
  linguagem_graficos: "en"

# Configurações de Execução
execucao:
  max_workers: 20
  teste_rapido: false
  llm_as_a_judge: false
  ignorar_erro_extracao: false

# Modelo Base (Gabarito/Referência)
modelo_base:
  arquivo: "saidas/saida_semclinbr_gold.parquet"
  rotulo: "Gold"
  familia: "SemClinBR-Gold"

# Modelos Comparados
modelos_comparacao:
  # --- A: zero-shot (sem ajuste fino) ---
  - arquivo: "saidas/saida_semclinbr_7b.parquet"
    rotulo: "Qwen7B"
    alias: "A"
    familia: "Qwen-7B"
    baseline: true
  # --- B: LoRA 4b direto, dados completos (sem CL) ---
  - arquivo: "saidas/saida_semclinbr_7b(b)_teste.parquet"
    rotulo: "Qwen7B(b)"
    alias: "B"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(b)"
  # --- C: Full FT 16b direto, dados completos (sem CL) ---
  - arquivo: "saidas/saida_semclinbr_7b(c)_teste.parquet"
    rotulo: "Qwen7B(c)"
    alias: "C"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(c)"
  # --- D1: CL por etapas + escalonamento FF→LoRA ---
  - arquivo: "saidas/saida_semclinbr_7b(d1)_teste.parquet"
    rotulo: "Qwen7B(d1)"
    alias: "D1"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d1)"
  # --- D2: CL por etapas + escalonamento LoRA→FF ---
  - arquivo: "saidas/saida_semclinbr_7b(d2)_teste.parquet"
    rotulo: "Qwen7B(d2)"
    alias: "D2"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d2)"
  # --- D3: CL acumulado (3 etapas) + escalonamento FF→LoRA ---
  - arquivo: "saidas/saida_semclinbr_7b(d3)_teste.parquet"
    rotulo: "Qwen7B(d3)"
    alias: "D3"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d3)"
  # --- D4: CL acumulado (3 etapas) + escalonamento LoRA→FF ---
  - arquivo: "saidas/saida_semclinbr_7b(d4)_teste.parquet"
    rotulo: "Qwen7B(d4)"
    alias: "D4"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d4)"
  # --- D11: CL acumulado granular (10 etapas) + FF→LoRA ---
  - arquivo: "saidas/saida_semclinbr_7b(d11)_teste.parquet"
    rotulo: "Qwen7B(d11)"
    alias: "D11"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d11)"
  # --- D12: CL acumulado granular (10 etapas) + LoRA→FF ---
  - arquivo: "saidas/saida_semclinbr_7b(d12)_teste.parquet"
    rotulo: "Qwen7B(d12)"
    alias: "D12"
    familia: "Qwen-7B"
    pasta_treinamento: "treinos/Qwen2.5-7B-Instruct(d12)"

# Configuração das Métricas e Campos
configuracao_comparacao:
  padronizar_simbolos: true
  rouge_stemmer: true

  filtro:
    arquivo: "dados/semclinbr.parquet"
    campo_id: "id"
    dataset_filtro: {"split": "teste"}

  nome_campo_id: "id"
  rotulo_campo_id: "ID"

  campos_parquet:
    id: "chave"
    resposta: "resposta"
    resumo_tokens: "resumo"
    avaliacao: ""
    erro: "erro"

  # (Opcional) Sobrescrita de modelos HF para BERTScore
  modelos:
    # Alternativa para pt-br clínico. Trocar exige rodar 03 E 06 com o mesmo
    # modelo, senão a dificuldade e a avaliação final ficam em escalas distintas.
    #bertscore: "pucpr/biobertpt-all"
    bertscore_batch_size: 1024

  mascaras:
    extracao: "^(.+)\\.json$"
    tokens: ".tokens.json"
    avaliacao: ".avaliacao.json"
    observabilidade: ".obs.json"

  # Configuração das análises estatísticas (Friedman, Wilcoxon, Nemenyi, etc.)
  campos_estatisticas:
    campos:
      - "(global)"
      - "Entidades"
      - "Relacoes"
    metricas:
      - bertscore
      - rouge_l
      - rouge_2

  # ========================================================================
  # Mapeamento de campos para métricas
  # ------------------------------------------------------------------------
  # Esquema da resposta: {"entities": [{id, text, tag, abbr}],
  #                       "relations": [{annotation1, annotation2, reltype}]}
  #
  # `entities.id`, `relations.annotation1` e `relations.annotation2` ficam de
  # FORA de propósito: são inteiros sequenciais e, depois do alinhamento húngaro
  # que util_json aplica às listas, não correspondem entre gabarito e predição.
  # Compará-los mediria o ruído da ordenação, não a qualidade da extração.
  # Idêntico ao bloco de 03_compara_gold_full.yaml — a dificuldade que ordena o
  # currículo e a avaliação final precisam sair da mesma régua.
  # ========================================================================
  campos:
    bertscore:
      - "(global)"
      - "entities"
      - "entities.text"
      - "Entidades"
      - "Relacoes"

    rouge_1:

    rouge_2:
      - "(global)"
      - "entities"
      - "entities.text"
      - "entities.tag"
      - "entities.abbr"
      - "relations"
      - "relations.reltype"
      - "Entidades"
      - "Relacoes"

    rouge_l:
      - "(global)"
      - "entities"
      - "entities.text"
      - "entities.tag"
      - "entities.abbr"
      - "relations"
      - "relations.reltype"
      - "Entidades"
      - "Relacoes"

campos_virtuais:
  Entidades:
    - entities.text
    - entities.tag
    - entities.abbr
  Relacoes:
    - relations.reltype
