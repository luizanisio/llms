# ==========================================================================
# Comparação: Panorama Completo (todos os protocolos)
# ==========================================================================
# Propósito: Visão global de todos os protocolos em um único relatório —
#   ranking geral, testes de Friedman/Nemenyi sobre a matriz completa e
#   verificação de consistência entre os relatórios temáticos.
#     baselines .......... A (zero-shot), b (LoRA), c (FF)
#     controles de B ..... b16 (16 bits), b16r8 (16 bits, r=8)
#     CL + escalonamento . d1-d4 (etapas/acumulado), d11-d12 (granulares)
#     ablações ........... d5-d8 (isolamento dos eixos), d13 (CL FF-only)
#     direção do CL ...... d9-d10 (anti-CL)
#     PT como warm-up .... d14, d15
#     controles 16b ...... d16 (fronteira pura), d17 (CL), d18 (blocos aleatórios)
#     PT por unfreeze .... d19 (com CL), d20 (sem CL)
#     protocolos fundidos. d21 (CL), d22 (CL+gating), d23 (gating),
#                          d24 (CL granular+gating, LoRA 4b), d25 (idem, full 16b)
# NOTA: relatório de panorama — protocolos diferem em precisão (4b/16b), regime
#   e orçamento; as leituras causais devem sair dos relatórios temáticos, onde
#   os pares estão controlados.
# Executar com: python ../../src/comparar_extracoes.py --config 06_compara_todos.yaml
# ==========================================================================

# --- Miscelânea ---
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/semclibr-experimento
    - /mnt/d/wsl_dev/llms/experimentos/semclibr-experimento
    - /opt/app-root/src/luiz/llms/experimentos/semclibr-experimento

# Configuração Global de Saída
saida:
  pasta: "compara/analises_comparacao_semclinbr_todos"
  pasta_parquet: "compara/"
  arquivo_base: "comparacao_semclinbr(todos)"
  regerar_planilha_base: true
  linguagem_graficos: "en"

# Configurações de Execução
execucao:
  max_workers: 20
  teste_rapido: false
  llm_as_a_judge: false
  ignorar_erro_extracao: false

# Modelo Base (Gabarito/Referência)
modelo_base:
  arquivo: "saidas/saida_semclinbr_gold.parquet"
  rotulo: "Gold"
  familia: "SemClinBR-Gold"

