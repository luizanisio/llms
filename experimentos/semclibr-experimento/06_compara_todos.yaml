# Configuração das Métricas e Campos
configuracao_comparacao:
  padronizar_simbolos: true
  rouge_stemmer: true

  filtro:
    arquivo: "dados/semclinbr.parquet"
    campo_id: "id"
    dataset_filtro: {"split": "teste"}

  nome_campo_id: "id"
  rotulo_campo_id: "ID"

  campos_parquet:
    id: "chave"
    resposta: "resposta"
    resumo_tokens: "resumo"
    avaliacao: ""
    erro: "erro"

  # (Opcional) Sobrescrita de modelos HF para BERTScore
  modelos:

  mascaras:
    extracao: "^(.+)\\.json$"
    tokens: ".tokens.json"
    avaliacao: ".avaliacao.json"
    observabilidade: ".obs.json"

  # ========================================================================
  # Mapeamento de campos para métricas
  # ------------------------------------------------------------------------
  # Esquema da resposta: {"entities": [{id, text, tag, abbr}],
  #                       "relations": [{annotation1, annotation2, reltype}]}
  #
  # `entities.id`, `relations.annotation1` e `relations.annotation2` ficam de
  # FORA de propósito: são inteiros sequenciais e, depois do alinhamento húngaro
  # que util_json aplica às listas, não correspondem entre gabarito e predição.
  # Compará-los mediria o ruído da ordenação, não a qualidade da extração.
  # Idêntico ao bloco de 03_compara_gold_full.yaml — a dificuldade que ordena o
  # currículo e a avaliação final precisam sair da mesma régua.
  # ========================================================================
  campos:
    rouge_1:

    rouge_2:
      - "(global)"
      - "entities"
      - "entities.text"
      - "entities.tag"
      - "entities.abbr"
      - "relations"
      - "relations.reltype"
      - "Entidades"
      - "Relacoes"

    rouge_l:
      - "(global)"
      - "entities"
      - "entities.text"
      - "entities.tag"
      - "entities.abbr"
      - "relations"
      - "relations.reltype"
      - "Entidades"
      - "Relacoes"

campos_virtuais:
  Entidades:
    - entities.text
    - entities.tag
    - entities.abbr
  Relacoes:
    - relations.reltype

estatistica:
  bayesiana: true
  frequentista: true

  # --- Likert do juiz LLM (secao PRINCIPAL) ---
  # CorrelatedTTest sobre a diferenca de notas pareada por documento.
  # A ROPE e calibrada empiricamente pela divergencia media entre
  # especialistas humanos (Etapa 1, secao A5) e transcrita manualmente.
  # Sensibilidade: reportada em 3 valores empiricos — menor, media e maior
  # divergencia entre pares de especialistas (ver receita A5).
  #
  # NOTA: enquanto campos_parquet.avaliacao estiver vazio nao ha notas do juiz
  #   e a secao principal e omitida com aviso; so as metricas automaticas rodam.
  rope_likert: 0.01              # PLACEHOLDER — transcrever da calibracao A5
                                 #   (divergencia media entre especialistas humanos).
                                 #   Deve ser > 0: com ROPE zero o baycomp devolve so
                                 #   (p_esquerda, p_direita), sem a equivalencia.

  limiar: 0.95                   # probabilidade minima p/ classificar (limiar UNICO
                                 #   do trabalho — Benavoli et al., 2017, §3.2)
  incluir_base: false            # ignorado quando 'protocolos' abaixo e um dicionario

  # --- Recortes pre-especificados por questao de pesquisa (B1) ---
  # 12 recortes + panorama geral — o "TODOS" gera a comparacao todos-contra-todos.
  # Cada entrada gera um conjunto proprio de figuras/tabelas, com o nome
  # virando prefixo dos arquivos e uma secao propria no relatorio.
  # Aceita alias ou rotulo; a ORDEM declarada e a ordem das linhas/colunas.
  # Ajustar as listas e rodar com --estatisticas NAO refaz a comparacao.
  # Protocolos comentados em modelos_comparacao (em treinamento) sao ignorados
  # automaticamente; os recortes ficam pre-especificados para quando estiverem
  # disponiveis.
  # Use "TODOS" como valor para incluir automaticamente todos os modelos ativos.
  protocolos:
    # Q1 — efeito do ajuste fino: zero-shot vs LoRA vs Full FT (3 contrastes)
    Q1_ajuste_fino: ["A", "B", "C"]
    # Q2a — CL controlado: D17xD18 = ordenar por dificuldade vs blocos
    #   aleatorios; D17xD16 = CL vs sem estrutura; D16xB16 = custo puro
    #   de fronteira (6 contrastes)
    Q2a_cl_controlado: ["B16", "D16", "D18", "D17"]
    # Q2b — CL puro: CL sem escalonamento, em cada regime (10 contrastes)
    Q2b_cl_puro: ["B", "D7", "D8", "D13", "D14"]
    # Q2c — granularidade: progressao granular (10 etapas) vs saltos (3)
    #   (6 contrastes)
    Q2c_granularidade: ["D3", "D4", "D11", "D12"]
    # Q3a — direcao do escalonamento com CL: FF->LoRA vs LoRA->FF
    #   (6 contrastes)
    Q3a_direcao_com_cl: ["D1", "D2", "D3", "D4"]
    # Q3b — direcao do escalonamento sem CL (controle) (6 contrastes)
    Q3b_direcao_sem_cl: ["B", "C", "D5", "D6"]
    # Q4a — decomposicao 2x2: CL so, escalonamento so, os dois, nenhum
    #   (10 contrastes)
    Q4a_decomposicao: ["B", "C", "D1", "D5", "D7"]
    # Q4b — unfreeze progressivo: D19 > D20 > C => sinergia CL+PT
    #   (3 contrastes)
    Q4b_unfreeze: ["B", "C", "D20", "D19"]
    # Q5 — direcao do curriculo: CL vs anti-CL (mesma base LoRA-only 4b)
    #   (10 contrastes)
    Q5_anti_curriculo: ["B", "D7", "D8", "D9", "D10"]
    # Q6a — fusao: D21xD17 = fundido vs segmentado, mesma topologia — teste
    #   mais limpo do custo de fronteira (10 contrastes)
    Q6a_fusao: ["B","C", "B16", "D17", "D21", "D22", "D23"]
    # Q6b — fusao granular; regime full vs LoRA (3 contrastes)
    Q6b_fusao_granular: ["B","C", "D12", "D24", "D25"]
    # Q6c — transicao de regime: pre-treino LoRA e estabilizacao pos-merge
    #   (6 contrastes)
    Q6c_transicao_regime: ["B","C", "D13", "D14", "D15"]
    # Panorama geral: todos os modelos ativos, para visao global
    Panorama_Geral: "TODOS"

  # --- Metricas automaticas (secao COMPLEMENTAR) ---
  # Medem similaridade com o modelo base (Prof), ou seja FIDELIDADE DE
  # DESTILACAO, nao qualidade: um protocolo que reproduz fielmente um erro do
  # professor e premiado por elas. Servem como triangulacao, nunca como veredito.
  # CorrelatedTTest (unico teste do pipeline bayesiano) sobre escores continuos.
  # Configuração das análises estatísticas (Friedman, Wilcoxon, Nemenyi, etc.)
  metricas_automaticas:
    # ROPE: margem sobre os ESCORES BRUTOS — |x - y| <= rope conta como empate.
    # Obrigatoria (> 0). Com escores comprimidos e a ROPE que determina o
    # resultado: pequena demais satura o heatmap em verde/vermelho, grande
    # demais deixa tudo azul. Por isso a varredura abaixo e obrigatoria de
    # reportar — a matriz em tres ROPEs e o minimo defensavel.
    rope: 0.01

    # Likert e MetaDados são os alvos de interesse das comparações pareadas (omitindo o "(global)").
    campos:
      - "(global)"
      - "Entidades"
      - "Relacoes"
    metricas:
      - rouge_l
      - rouge_2      