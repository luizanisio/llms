# Executar com: python ../../src/treinar_unsloth.py --treinar 04_treinar_d12.yaml
# Executar com: python ../../src/treinar_unsloth.py --datasets 04_treinar_d12.yaml

# ==========================================================================
# CONFIGURAÇÃO DE TREINAMENTO - Qwen 2.5 7B (Protocolo D12)
# ==========================================================================
# Papel:   Experimental (variante granular de D4)
# Modo:    CL acumulado granular + Escalonamento LoRA→FF
# Etapas:  LoRA(≤1) → LoRA(≤2) → ... → LoRA(≤9) → FF-tudo
# Objetivo: CL com progressão suave (incremento unitário de dificuldade_int)
#           e acúmulo de dados entre etapas. Direção LoRA→FF.
#           Variação de D4 com 10 etapas em vez de 3, para avaliar se
#           uma progressão mais granular melhora o desempenho.
# Pergunta: Q5 (granularidade do currículo: progressão suave vs saltos)
# Comparar: d12 vs d4 (Q5: granularidade), d12 vs d3 (Q3+Q5), d12 vs b (Q2)
# Ambiente: H100 80GB (1 GPU via Slurm)
# ==========================================================================

#| =========================================================================
#| MISCELÂNEA
#| =========================================================================
#| Configurações diversas (logs, variáveis de ambiente).
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/semclibr-experimento
    - /mnt/d/wsl_dev/llms/experimentos/semclibr-experimento
    - /opt/app-root/src/luiz/llms/experimentos/semclibr-experimento
  pastas_modelos:
    - /students/luiz.abatitucci/models
    - /students/luiz.abatitucci/llms/experimentos/semclibr-experimento/treinos
    - /mnt/d/wsl_dev/llms/experimentos/semclibr-experimento/treinos
    - /mnt/d/wsl_ollama/hf-models
    - /opt/app-root/src/luiz/llms/_models
#| =========================================================================
#| CURRICULUM
#| =========================================================================
#| Cada etapa corresponde a uma divisão do dataset com parâmetros de treino.
#| O campo 'arquivo' é o CSV de divisão (equivalente a pastas.divisao.arquivo).
curriculum:
  #| Saida: Especifica o "Gold Dataset", ou seja, os resultados esperados no gabarito
  saida:
    #| Caminho do arquivo parquet que contém as respostas esperadas
    dataframe: saidas/saida_semclinbr_gold.parquet
    #| Nome da coluna que contém o JSON de resposta
    dataframe_col: resposta
    #| Nome da coluna que contém o identificador do item
    dataframe_id: chave
    #| Formato estruturado esperado
    formato: json
    texto_criptografado: false

  #| Entrada: Especifica os dados que o modelo vai receber como prompt
  entrada:
    #| Arquivo parquet com o texto fonte a ser processado
    dataframe: dados/semclinbr.parquet
    #| Nome da coluna que contém o texto (prompt)
    dataframe_col: texto
    #| Nome da coluna que contém o identificador do item
    dataframe_id: id
    #| Arquivo TXT com o template que dita como o texto bruto será empacotado
    prompt_template: dados/prompt_semclinbr.txt
    tag_texto: '<<--TEXTO-->>'
    texto_criptografado: false
    prompt_criptografado: false

  validacao:
    exigir_json_valido: true
    exigir_ids_pareados: false

  #| Divisao: Define as etapas do treinamento (o currículo em si)
  #| CL acumulado granular LoRA→FF: LoRA(≤1) → LoRA(≤2) → ... → LoRA(≤9) → FF-tudo
  divisao:
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=1"}
    alias: "f1"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=2"}
    alias: "f2"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=3"}
    alias: "f3"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=4"}
    alias: "f4"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=5"}
    alias: "f5"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=6"}
    alias: "f6"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=7"}
    alias: "f7"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=8"}
    alias: "f8"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    dataset_filtro: {"dificuldade_int": "<=9"}
    alias: "f9"
    tipo: "lora"
    learning_rate: 2e-05
    pace_epochs: 2
  - arquivo: dados/divisao_Gold_Qwen7B.csv
    alias: "completo-FF"
    tipo: "full"
    learning_rate: 5e-06
    #| Etapas 'full' sempre rodam em 16 bits (fixado no código) — não existe chave 'bits' por etapa.
    pace_epochs: 2
    batch_size: 1

#| =========================================================================
#| MODELO
#| =========================================================================
#| Configurações do modelo base e diretório de saída.
modelo:
  #| Caminho do modelo pré-treinado usado como fundação
  base_model_name: Qwen2.5-7B-Instruct
  #| Diretório final onde os pesos atualizados serão salvos
  saida: treinos/Qwen2.5-7B-Instruct(d12)
  #| Mapeamentos úteis se o modelo for servido via Ollama após o treinamento
  ollama: Qwen2.5-7B-Instruct(d12):latest
  ollama_base: qwen2.5:7b
  ollama_url:

#| =========================================================================
#| TREINAMENTO
#| =========================================================================
#| Configurações de hiperparâmetros (Unsloth).
treinamento:
  flash_attention_2: true   # Atenção O(n) em VRAM em vez de O(n²)
  liger_kernel: true        # Fused cross-entropy, RoPE, RMSNorm (~40% menos pico de VRAM)
  full_com_sdpa: true       # Permite fallback para SDPA se o flash_attention_2 não puder ser ativado, salvando VRAM no modo Full FT.

  eval_steps: 20%

  #| Configuração do tamanho do lote (batch). Lote por GPU é 1, com acumulação de 16 (efetivo 16).
  #| ATENÇÃO: `efetivo` MANDA. _aplicar_batch_size_auto (src/treinar_unsloth_util.py)
  #| recalcula grad_batch_size = efetivo / (batch_size x n_gpus) e SOBRESCREVE o valor
  #| escrito abaixo. Com efetivo=16 e batch_size=1 em 1 GPU, o acúmulo real é 16.
  batch_size:
    efetivo: 16
    batch_size: 1
  grad_batch_size: 16

  #| Número total de épocas (passagens pelo dataset completo)
  num_train_epochs: 4
  max_seq_length: 12288
  validar_max_seq_length: true
  #| Remove os exemplos que ultrapassam o limite (esperado: nenhum, o corpus cabe em 12288)
  filtrar_max_seq_length: true

  #| Taxa de aprendizado base, otimizada para full finetuning
  learning_rate: 2e-05
  max_grad_norm: 1
  save_checkpoints: true
  resume_from_checkpoint: true
  warmup_steps: 5
  weight_decay: 0.01
  optim: adamw_8bit

  #| Curva de decaimento da taxa de aprendizado (suaviza nos passos finais)
  lr_scheduler_type: cosine
  seed: 3407

  #| Realiza o treinamento em 4-bits (LoRA)
  nbits: 4

  #| Aplica o aprendizado apenas nos tokens da resposta, ignorando o prompt do usuário
  train_on_responses_only: true

#| =========================================================================
#| LORA (Low-Rank Adaptation)
#| =========================================================================
#| Configura a técnica de Parameter-Efficient Fine-Tuning.
lora:
  #| Dimensão da atualização de pesos. 16 é um bom balanço entre capacidade e memória.
  r: 16
  #| Fator de escala, geralmente o dobro do rank.
  alpha: 32
  dropout: 0.05

  #| Conecta os adaptadores em todas as projeções lineares para melhorar a expressividade.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
