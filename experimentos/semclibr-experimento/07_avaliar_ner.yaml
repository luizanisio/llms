# ==========================================================================
# Trilha NER-F1 — variável primária declarada no README §6
# ==========================================================================
# O comparar_extracoes.py mede similaridade textual (BERTScore/ROUGE) sobre o
# JSON de saída. Isso ordena o currículo (passo 03) e alimenta os gráficos e a
# análise bayesiana (passo 06), mas NÃO é o F1 de reconhecimento de entidades
# que o corpus SemClinBr exige e que os sistemas publicados (CRF de Souza et
# al., BioBERTpt de Schneider et al.) reportam.
#
# Este passo roda em paralelo ao 06, sobre os MESMOS parquets de saída, e
# produz f1_strict / lenient / flexible / relaxed por documento chamando
# avaliar_documento() de util_semclinbr.py — a unidade da análise pareada.
#
# Executar com: python 07_avaliar_ner.py --config 07_avaliar_ner.yaml
# ==========================================================================

misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/semclibr-experimento
    - /mnt/d/wsl_dev/llms/experimentos/semclibr-experimento
    - /opt/app-root/src/luiz/llms/experimentos/semclibr-experimento

# --- Corpus de referência (gabarito COM offsets, que o parquet não carrega) ---
corpus:
  xml: "dados/SemClinBr-xml-public-v1"
  # Divisão gerada pelo passo 03 (traz `dificuldade` para o recorte do §7.3).
  divisao: "dados/divisao_Gold_Qwen7B.csv"
  split: "teste"
  # SemGroups.txt oficial do UMLS (ABBR|GROUP|TUI|STY). Sem ele vale o mapa
  # STY→SGR embutido em util_semclinbr.py, que cobre os rótulos do corpus.
  semgroups: ""

# --- Saída ---
saida:
  pasta: "compara/ner"

execucao:
  # Colunas dos parquets de saída dos passos 02 e 05
  campos_parquet:
    id: "chave"
    resposta: "resposta"
    erro: "erro"
  # Variável primária: a mais exigente e a que menos depende do mapa STY→SGR
  metrica_primaria: "f1_strict"
  # Complementares, também tabuladas e analisadas
  metricas_complementares:
    - f1_lenient
    - f1_flexible
    - f1_relaxed
    - f1_span_exato
    - f1_span_parcial
    - f1_relacoes
  # Piso de viabilidade do §7.5 — fixado ANTES de olhar os resultados.
  # 0,70 coincide com o IAA strict do corpus (referência de dificuldade, não teto).
  piso_viabilidade: 0.70
  lang: "en"

# --- Protocolos avaliados (mesmos arquivos de 06_compara_todos.yaml) ---
protocolos:
  - arquivo: "saidas/saida_semclinbr_7b.parquet"
    alias: "A"
