# ==========================================================================
# Comparação: Experimento Principal (Q1 + Q2 + Q3 + Q5)
# ==========================================================================
# Propósito: Responder as perguntas de pesquisa com os protocolos centrais
#   (todos SEGMENTADOS — uma execução de trainer por etapa).
#   Q1 — Efeito do ajuste fino: A vs {b, c, d1..d4, d11, d12}
#   Q2 — Efeito do CL: {b, c} vs {d1, d2, d3, d4}
#   Q3 — Direção do escalonamento: d1 vs d2, d3 vs d4, d11 vs d12
#   Q5 — Pace do currículo (progressão suave vs saltos): d11 vs d3, d12 vs d4
#   Complementar: d1/d2 (etapas disjuntas) vs d3/d4 (acumulado com replay)
# Modelos: A (zero-shot), b (LoRA), c (FF), d1-d4 (CL+escalonamento), d11-d12 (granulares)
# Ver também: 06_compara_ordem_pt (Q3 completa), 06_compara_ordem_cl (Q4),
#             06_compara_ablacoes (isolamento), 06_compara_fronteiras (Q6)
# Executar com: python ../../src/comparar_extracoes.py --config 06_compara_experimentais.yaml
# Executar com: python ../../src/comparar_extracoes.py --config 06_compara_experimentais.yaml --estatisticas
# ==========================================================================

# --- Miscelânea ---
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/pubmed-experimento
    - /mnt/d/wsl_dev/llms/experimentos/pubmed-experimento
    - /opt/app-root/src/luiz/llms/experimentos/pubmed-experimento
    - /mnt/d/wsl/llms/experimentos/pubmed-experimento

# Configuração Global de Saída
saida:
  pasta: "compara/analises_comparacao_pubmed_experimentais"
  pasta_parquet: "compara/"
  arquivo_base: "comparacao_pubmed(experimentais)"
  regerar_planilha_base: true
  linguagem_graficos: "en"

# Configurações de Execução
execucao:
  max_workers: 20
  teste_rapido: false
  llm_as_a_judge: false
  ignorar_erro_extracao: false

# Modelo Base (Gabarito/Referência)
modelo_base:
  arquivo: "saidas/saida_pubmed_prof.parquet"
  rotulo: "Professor"
  familia: "PubMed-Gold"

# Modelos Comparados
modelos_comparacao:
  # --- A: zero-shot (sem ajuste fino) ---
  - arquivo: "saidas/saida_pubmed_1_5b.parquet"
    rotulo: "Qwen1.5B"
    alias: "A"
    familia: "Qwen-1.5B"
    baseline: true
  # --- B: LoRA 4b direto, dados completos (sem CL) ---
  - arquivo: "saidas/saida_pubmed_1_5b(b)_teste.parquet"
    rotulo: "Qwen1.5B(b)"
    alias: "B"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(b)"
  # --- C: Full FT 16b direto, dados completos (sem CL) ---
  - arquivo: "saidas/saida_pubmed_1_5b(c)_teste.parquet"
    rotulo: "Qwen1.5B(c)"
    alias: "C"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(c)"
  # --- D1: CL por etapas + escalonamento FF→LoRA ---
  - arquivo: "saidas/saida_pubmed_1_5b(d1)_teste.parquet"
    rotulo: "Qwen1.5B(d1)"
    alias: "D1"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d1)"
  # --- D2: CL por etapas + escalonamento LoRA→FF ---
  - arquivo: "saidas/saida_pubmed_1_5b(d2)_teste.parquet"
    rotulo: "Qwen1.5B(d2)"
    alias: "D2"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d2)"
  # --- D3: CL acumulado (3 etapas) + escalonamento FF→LoRA ---
  - arquivo: "saidas/saida_pubmed_1_5b(d3)_teste.parquet"
    rotulo: "Qwen1.5B(d3)"
    alias: "D3"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d3)"
  # --- D4: CL acumulado (3 etapas) + escalonamento LoRA→FF ---
  - arquivo: "saidas/saida_pubmed_1_5b(d4)_teste.parquet"
    rotulo: "Qwen1.5B(d4)"
    alias: "D4"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d4)"
  # --- D11: CL acumulado granular (10 etapas) + FF→LoRA ---
  - arquivo: "saidas/saida_pubmed_1_5b(d11)_teste.parquet"
    rotulo: "Qwen1.5B(d11)"
    alias: "D11"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d11)"
  # --- D12: CL acumulado granular (10 etapas) + LoRA→FF ---
  - arquivo: "saidas/saida_pubmed_1_5b(d12)_teste.parquet"
    rotulo: "Qwen1.5B(d12)"
    alias: "D12"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d12)"

# Configuração das Métricas e Campos
configuracao_comparacao:
  padronizar_simbolos: true
  rouge_stemmer: true

  filtro:
    arquivo: "dados/pubmed-rct-20k.parquet"
    campo_id: "pmid"
    dataset_filtro: {"split": "test"}

  nome_campo_id: "id"
  rotulo_campo_id: "ID"

  campos_parquet:
    id: "chave"
    resposta: "resposta"
    resumo_tokens: "resumo"
    avaliacao: ""
    erro: "erro"

  modelos:
    bertscore_batch_size: 1024
    sbert_batch_size: 1024

  mascaras:
    extracao: "^(\\d+)\\.json$"
    tokens: ".tokens.json"
    avaliacao: ".avaliacao.json"
    observabilidade: ".obs.json"

  # Configuração das análises estatísticas (Friedman, Wilcoxon, Nemenyi, etc.)
  campos_estatisticas:
    campos:
      - "(global)"
      - "Sentencas"
      - "MetaDados"
    metricas:
      - rouge_l

  campos:

    rouge_1:

    rouge_2:
      - "title"
      - "publication"
      - "journal"
      - "keywords"

    rouge_l:
      - "(global)"
      - "title"
      - "publication"
      - "journal"
      - "keywords"
      - "background"
      - "objective"
      - "methods"
      - "results"
      - "conclusions"
      - "Sentencas"
      - "MetaDados"

    levenshtein:
      - "publication"
      - "journal"


campos_virtuais:
  Sentencas:
    - background
    - objective
    - methods
    - results
    - conclusions
  MetaDados:
    - title
    - publication
    - journal
    - keywords


estatistica:
  bayesiana: true
  frequentista: true
  protocolos:
    Panorama_Geral: "TODOS"
  metricas_automaticas:
    # ROPE: margem sobre os ESCORES BRUTOS — |x - y| <= rope conta como empate.
    # Obrigatoria (> 0). Com escores comprimidos e a ROPE que determina o
    # resultado: pequena demais satura o heatmap em verde/vermelho, grande
    # demais deixa tudo azul. Por isso a varredura abaixo e obrigatoria de
    # reportar — a matriz em tres ROPEs e o minimo defensavel.
    # Maior diferença de F1 entre as três rodadas de D1 em todas as métricas automáticas
    rope: 0.0030
    rope_sensibilidade: [0.0015, 0.0030, 0.0045]

    # Mesmos agregados de campos_estatisticas, sem o "(global)": Sentenças e
    # MetaDados sao os alvos de interesse das comparacoes pareadas.
    campos:
      - "Sentencas"
      - "MetaDados"
    metricas:
      - rouge_l