# ==========================================================================
# Comparação: Direção do Currículo (Q4)
# ==========================================================================
# Propósito: Responder Q4 — a ordem fácil→difícil importa, ou basta fatiar os dados?
#   Contrasta três ordenações sobre a MESMA partição de dados, em LoRA-only:
#     crescente (CL) × decrescente (anti-CL) × aleatória (controle de bloco).
#   Comparações-chave:
#     d7 vs d9    → efeito da direção no pace por etapas disjuntas (4 bits)
#     d8 vs d10   → efeito da direção no pace acumulado (4 bits)
#     d17 vs d18  → dificuldade crescente vs terços ALEATÓRIOS, 16 bits, mesmas
#                   fronteiras e mesmo orçamento — o controle que separa
#                   "ordenar por dificuldade" de "treinar em blocos com recência"
#     d7/d8 vs b     → CL melhora sobre o baseline direto?
#     d9/d10 vs b    → anti-CL melhora sobre o baseline direto?
#     d18 vs b       → só fatiar em blocos (sem ordenar) já muda o resultado?
# Modelos: A (zero-shot), b (LoRA direto), d7/d8 (CL), d9/d10 (anti-CL),
#          d17 (CL 16b), d18 (blocos aleatórios 16b)
# NOTA: d7-d10 rodaram em LoRA 4 bits e d17/d18 em LoRA 16 bits. Comparações
#       válidas são intra-precisão (d7×d9, d8×d10, d17×d18); cruzamentos entre
#       os dois grupos carregam {ordem + quantização} como diferença conjunta.
# Executar com: python ../../src/comparar_extracoes.py --config 06_compara_ordem_cl.yaml
# ==========================================================================

# --- Miscelânea ---
