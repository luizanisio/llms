  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/pubmed-experimento
    - /mnt/d/wsl_dev/llms/experimentos/pubmed-experimento
    - /opt/app-root/src/luiz/llms/experimentos/pubmed-experimento
    - /mnt/d/wsl/llms/experimentos/pubmed-experimento

# Configuração Global de Saída
saida:
  pasta: "compara/analises_comparacao_pubmed_ordem_cl"
  pasta_parquet: "compara/"
  arquivo_base: "comparacao_pubmed(ordem_cl)"
  regerar_planilha_base: true
  linguagem_graficos: "en"

# Configurações de Execução
execucao:
  max_workers: 20
  teste_rapido: false
  llm_as_a_judge: false
  ignorar_erro_extracao: false

# Modelo Base (Gabarito/Referência)
modelo_base:
  arquivo: "saidas/saida_pubmed_prof.parquet"
  rotulo: "Professor"
  familia: "PubMed-Gold"

# Modelos Comparados
modelos_comparacao:
  # --- A: zero-shot (sem ajuste fino) ---
  - arquivo: "saidas/saida_pubmed_1_5b.parquet"
    rotulo: "Qwen1.5B"
    alias: "A"
    familia: "Qwen-1.5B"
    baseline: true
  # --- B: LoRA 4b direto, dados completos (sem CL) ---
  - arquivo: "saidas/saida_pubmed_1_5b(b)_teste.parquet"
    rotulo: "Qwen1.5B(b)"
    alias: "B"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(b)"
  # --- D7: CL por etapas, LoRA-only 4b ---
  - arquivo: "saidas/saida_pubmed_1_5b(d7)_teste.parquet"
    rotulo: "Qwen1.5B(d7)"
    alias: "D7"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d7)"
  # --- D8: CL acumulado, LoRA-only 4b ---
  - arquivo: "saidas/saida_pubmed_1_5b(d8)_teste.parquet"
    rotulo: "Qwen1.5B(d8)"
    alias: "D8"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d8)"
  # --- D9: Anti-CL por etapas, LoRA-only 4b ---
  - arquivo: "saidas/saida_pubmed_1_5b(d9)_teste.parquet"
    rotulo: "Qwen1.5B(d9)"
    alias: "D9"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d9)"
  # --- D10: Anti-CL acumulado, LoRA-only 4b ---
  - arquivo: "saidas/saida_pubmed_1_5b(d10)_teste.parquet"
    rotulo: "Qwen1.5B(d10)"
    alias: "D10"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d10)"
  # --- D17: CL por etapas, LoRA 16b (D7 sem quantização) ---
  - arquivo: "saidas/saida_pubmed_1_5b(d17)_teste.parquet"
    rotulo: "Qwen1.5B(d17)"
    alias: "D17"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d17)"
  # --- D18: Blocos aleatórios (terços), LoRA 16b (controle de efeito de bloco) ---
  - arquivo: "saidas/saida_pubmed_1_5b(d18)_teste.parquet"
    rotulo: "Qwen1.5B(d18)"
    alias: "D18"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d18)"

# Configuração das Métricas e Campos
configuracao_comparacao:
  padronizar_simbolos: true
  rouge_stemmer: true

  filtro:
    arquivo: "dados/pubmed-rct-20k.parquet"
    campo_id: "pmid"
    dataset_filtro: {"split": "test"}

  nome_campo_id: "id"
  rotulo_campo_id: "ID"

  campos_parquet:
    id: "chave"
    resposta: "resposta"
    resumo_tokens: "resumo"
    avaliacao: ""
    erro: "erro"

  modelos:
    bertscore_batch_size: 1024
    sbert_batch_size: 1024

  mascaras:
    extracao: "^(\\d+)\\.json$"
    tokens: ".tokens.json"
    avaliacao: ".avaliacao.json"
    observabilidade: ".obs.json"

  # Configuração das análises estatísticas (Friedman, Wilcoxon, Nemenyi, etc.)
  campos_estatisticas:
    campos:
      - "(global)"
      - "Sentencas"
      - "MetaDados"
    metricas:
      - rouge_l

  campos:

    rouge_1:

    rouge_2:
      - "title"
      - "publication"
      - "journal"
      - "keywords"

    rouge_l:
      - "(global)"
      - "title"
      - "publication"
      - "journal"
      - "keywords"
      - "background"
      - "objective"
      - "methods"
      - "results"
      - "conclusions"
      - "Sentencas"
      - "MetaDados"

    levenshtein:
      - "publication"
      - "journal"


campos_virtuais:
  Sentencas:
    - background
    - objective
    - methods
    - results
    - conclusions
  MetaDados:
    - title
    - publication
    - journal
    - keywords


estatistica:
  bayesiana: true
  frequentista: true
  protocolos:
    Panorama_Geral: "TODOS"
  metricas_automaticas:
    # ROPE: margem sobre os ESCORES BRUTOS — |x - y| <= rope conta como empate.
    # Obrigatoria (> 0). Com escores comprimidos e a ROPE que determina o
    # resultado: pequena demais satura o heatmap em verde/vermelho, grande
    # demais deixa tudo azul. Por isso a varredura abaixo e obrigatoria de
    # reportar — a matriz em tres ROPEs e o minimo defensavel.
    # Maior diferença de F1 entre as três rodadas de D1 em todas as métricas automáticas
    rope: 0.0030
    rope_sensibilidade: [0.0015, 0.0030, 0.0045]

    # Mesmos agregados de campos_estatisticas, sem o "(global)": Sentenças e
    # MetaDados sao os alvos de interesse das comparacoes pareadas.
    campos:
      - "Sentencas"
      - "MetaDados"
    metricas:
      - rouge_l