# ==========================================================================
# Comparação: Direção do Escalonamento de Capacidade (Q3)
# ==========================================================================
# Propósito: Responder Q3 — FF→LoRA e LoRA→FF produzem desempenhos distintos?
#   Cobre a pergunta nos dois regimes de dados: COM CL (d1-d4) e SEM CL (d5, d6).
#   Comparações-chave (direção, pareadas):
#     d1 vs d2    → direção com CL por etapas disjuntas
#     d3 vs d4    → direção com CL acumulado
#     d5 vs d6    → direção sem CL (controle limpo do eixo PT)
#   Comparações de suporte (o escalonamento vale o custo?):
#     d5 vs c / d5 vs b → FF→LoRA melhora sobre o treino direto?
#     d6 vs c / d6 vs b → LoRA→FF melhora sobre o treino direto?
#     d1 vs d5 / d2 vs d6 → o CL adiciona valor dado a mesma direção de escalonamento?
# Modelos: A (zero-shot), b (LoRA), c (FF), d1-d4 (com CL), d5-d6 (sem CL)
# Ver também: 06_compara_capacidade — a mesma pergunta para o eixo PT
#             implementado DENTRO da parametrização (unfreeze/gating, d19-d23, d25)
# Executar com: python ../../src/comparar_extracoes.py --config 06_compara_ordem_pt.yaml
# ==========================================================================

# --- Miscelânea ---
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/pubmed-experimento
    - /mnt/d/wsl_dev/llms/experimentos/pubmed-experimento
    - /opt/app-root/src/luiz/llms/experimentos/pubmed-experimento
    - /mnt/d/wsl/llms/experimentos/pubmed-experimento

# Configuração Global de Saída
saida:
  pasta: "compara/analises_comparacao_pubmed_ordem_pt"
  pasta_parquet: "compara/"
  arquivo_base: "comparacao_pubmed(ordem_pt)"
  regerar_planilha_base: true
  linguagem_graficos: "en"

# Configurações de Execução
execucao:
  max_workers: 20
  teste_rapido: false
  llm_as_a_judge: false
  ignorar_erro_extracao: false

# Modelo Base (Gabarito/Referência)
modelo_base:
  arquivo: "saidas/saida_pubmed_prof.parquet"
  rotulo: "Professor"
  familia: "PubMed-Gold"

# Modelos Comparados
modelos_comparacao:
  # --- A: zero-shot (sem ajuste fino) ---
  - arquivo: "saidas/saida_pubmed_1_5b.parquet"
    rotulo: "Qwen1.5B"
    alias: "A"
    familia: "Qwen-1.5B"
    baseline: true
  # --- B: LoRA 4b direto, dados completos (sem CL) ---
  - arquivo: "saidas/saida_pubmed_1_5b(b)_teste.parquet"
    rotulo: "Qwen1.5B(b)"
    alias: "B"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(b)"
  # --- C: Full FT 16b direto, dados completos (sem CL) ---
  - arquivo: "saidas/saida_pubmed_1_5b(c)_teste.parquet"
    rotulo: "Qwen1.5B(c)"
    alias: "C"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(c)"
  # --- D1: CL por etapas + escalonamento FF→LoRA ---
  - arquivo: "saidas/saida_pubmed_1_5b(d1)_teste.parquet"
    rotulo: "Qwen1.5B(d1)"
    alias: "D1"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d1)"
  # --- D2: CL por etapas + escalonamento LoRA→FF ---
  - arquivo: "saidas/saida_pubmed_1_5b(d2)_teste.parquet"
    rotulo: "Qwen1.5B(d2)"
    alias: "D2"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d2)"
  # --- D3: CL acumulado (3 etapas) + escalonamento FF→LoRA ---
  - arquivo: "saidas/saida_pubmed_1_5b(d3)_teste.parquet"
    rotulo: "Qwen1.5B(d3)"
    alias: "D3"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d3)"
  # --- D4: CL acumulado (3 etapas) + escalonamento LoRA→FF ---
  - arquivo: "saidas/saida_pubmed_1_5b(d4)_teste.parquet"
    rotulo: "Qwen1.5B(d4)"
    alias: "D4"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d4)"
  # --- D5: Escalonamento FF→LoRA sem CL (dados completos) ---
  - arquivo: "saidas/saida_pubmed_1_5b(d5)_teste.parquet"
    rotulo: "Qwen1.5B(d5)"
    alias: "D5"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d5)"
  # --- D6: Escalonamento LoRA→FF sem CL (dados completos) ---
  - arquivo: "saidas/saida_pubmed_1_5b(d6)_teste.parquet"
    rotulo: "Qwen1.5B(d6)"
    alias: "D6"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d6)"

# Configuração das Métricas e Campos
configuracao_comparacao:
  padronizar_simbolos: true
  rouge_stemmer: true

  filtro:
    arquivo: "dados/pubmed-rct-20k.parquet"
    campo_id: "pmid"
    dataset_filtro: {"split": "test"}

  nome_campo_id: "id"
  rotulo_campo_id: "ID"

  campos_parquet:
    id: "chave"
    resposta: "resposta"
    resumo_tokens: "resumo"
    avaliacao: ""
    erro: "erro"

  modelos:
    bertscore_batch_size: 1024
    sbert_batch_size: 1024

  mascaras:
    extracao: "^(\\d+)\\.json$"
    tokens: ".tokens.json"
    avaliacao: ".avaliacao.json"
    observabilidade: ".obs.json"

  # Configuração das análises estatísticas (Friedman, Wilcoxon, Nemenyi, etc.)
  campos_estatisticas:
    campos:
      - "(global)"
      - "Sentencas"
      - "MetaDados"
    metricas:
      - bertscore
      - rouge_l
      - sbert_grande

  campos:
    bertscore:
      - "(global)"
      - "background"
      - "objective"
      - "methods"
      - "results"
      - "conclusions"
      - "Sentencas"
      - "MetaDados"

    rouge_1:

    rouge_2:
      - "title"
      - "publication"
      - "journal"
      - "keywords"

    rouge_l:
      - "(global)"
      - "title"
      - "publication"
      - "journal"
      - "keywords"
      - "background"
      - "objective"
      - "methods"
      - "results"
      - "conclusions"
      - "Sentencas"
      - "MetaDados"

    levenshtein:
      - "publication"
      - "journal"

    sbert_grande:
      - "background"
      - "objective"
      - "methods"
      - "results"
      - "conclusions"
      - "Sentencas"
      - "MetaDados"

campos_virtuais:
  Sentencas:
    - background
    - objective
    - methods
    - results
    - conclusions
  MetaDados:
    - title
    - publication
    - journal
    - keywords
