    rotulo: "Qwen1.5B(d22)"
    alias: "D22"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d22)"
  # --- D23: FUSÃO: gating de LR sem CL (dados completos), LoRA 16b ---
