    rotulo: "Qwen1.5B(d17)"
    alias: "D17"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d17)"
  # --- D19: CL por etapas + unfreeze progressivo, FF 16b ---
