# Executar com: python ../../src/treinar_unsloth.py --treinar 04_treinar_d23.yaml
# Executar com: python ../../src/treinar_unsloth.py --datasets 04_treinar_d23.yaml

# ==========================================================================
# CONFIGURAÇÃO DE TREINAMENTO - Qwen 2.5 1.5B (Protocolo D23)
# ==========================================================================
# Papel:   Controle (PT fundido sem CL — isola o gating)
# Modo:    FUSÃO: LoRA 16 bits, gating de LR por camada, DADOS COMPLETOS em
#          todos os spans (sem progressão de dificuldade)
# Spans:   completo(uf 75%) ×1 → completo(uf 50%) ×1 → completo(uf 25%) ×1 → completo(uf 0%) ×1
# Objetivo: Mesma progressão de capacidade do D22, sem progressão de dados.
#           Fecha o 2×2 fundido: {CL, ¬CL} × {gating, ¬gating} =
#           {D22, D23} × {D21, D16*}. Leitura: d23 vs d16 aproxima o efeito
#           do gating puro (com a ressalva de fronteiras reais vs virtuais);
#           d22 vs d23 mede o CL dado o gating; d23 vs b mede se o PT sozinho
#           já compete com o direto.
#           (*D16 é segmentado; o análogo fundido exato de "¬CL ¬gating" é o
#           próprio B, que é um run único sem spans — a comparação primária
#           de d23 é contra b e d22.)
# Orçamento: 4 spans × 1 época × N = 4N instâncias (paridade com B/D16/D21/D22).
# Comparar: d23 vs d22 (CL dado gating), d23 vs b (gating puro vs direto)
# Ambiente: H100 80GB (1 GPU via Slurm)
# Requisito: código com suporte ao modo FUSÃO + gating de LR por grupos
#
# NOTA: pace_epochs: 1 por span (vs 2 no D22) porque cada span usa o conjunto
# COMPLETO — mantém o orçamento total de 4N. Os steps de ativação dos grupos
# caem em posições diferentes das do D22 (25%/50%/75% do stream vs ~8%/25%/50%);
# isso é consequência inevitável de equalizar orçamento e dados simultaneamente,
# e deve ser registrado como limitação na comparação d22 vs d23.
# ==========================================================================

#| =========================================================================
#| MISCELÂNEA
#| =========================================================================
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/pubmed-experimento
    - /mnt/d/wsl_dev/llms/experimentos/pubmed-experimento
    - /opt/app-root/src/luiz/llms/experimentos/pubmed-experimento
  pastas_modelos:
    - /students/luiz.abatitucci/models
    - /mnt/d/wsl_ollama/hf-models
    - /opt/app-root/src/luiz/llms/_models

#| =========================================================================
#| CURRICULUM
#| =========================================================================
curriculum:
  saida:
    dataframe: saidas/saida_pubmed_prof.parquet
    dataframe_col: resposta
    dataframe_id: chave
    formato: json
    texto_criptografado: false

  entrada:
    dataframe: dados/pubmed-rct-20k.parquet
    dataframe_col: article
    dataframe_id: pmid
    prompt_template: dados/prompt_pubmed_rct.txt
    tag_texto: '<<--TEXTO-->>'
    texto_criptografado: false
    prompt_criptografado: false

  validacao:
    exigir_json_valido: true
    exigir_ids_pareados: false

  #| FUSÃO: parâmetros globais do run único
  fusao:
    ativo: true
    tipo: "lora"              # gating sobre adapters LoRA (base congelada)
    learning_rate: 2e-05      # pico único do cosine global
    warmup_grupo_steps: 100   # rampa de cada grupo ao acordar (0 → cosine atual)
    seed_shuffle: 3407

  #| Progressão de capacidade SEM progressão de dados: todos os spans usam o
  #| conjunto completo; apenas o gating avança nas fronteiras virtuais.
  divisao:
  - arquivo: compara/analises_comparacao_pubmed (full)/divisoes/divisao_Professor_Qwen1_5B.csv
    alias: "completo-uf75"
    pace_epochs: 1
    unfreeze_layers_from: 75%   # G1 ativo do step 0: adapters dos blocos 21-27 + cabeça
  - arquivo: compara/analises_comparacao_pubmed (full)/divisoes/divisao_Professor_Qwen1_5B.csv
    alias: "completo-uf50"
    pace_epochs: 1
    unfreeze_layers_from: 50%   # G2 acorda aos ~25% do stream
  - arquivo: compara/analises_comparacao_pubmed (full)/divisoes/divisao_Professor_Qwen1_5B.csv
    alias: "completo-uf25"
    pace_epochs: 1
    unfreeze_layers_from: 25%   # G3 acorda aos ~50% do stream
  - arquivo: compara/analises_comparacao_pubmed (full)/divisoes/divisao_Professor_Qwen1_5B.csv
    alias: "completo-uf0"
    pace_epochs: 1
    unfreeze_layers_from: 0%    # G4 acorda aos ~75% do stream

#| =========================================================================
#| MODELO
#| =========================================================================
modelo:
  base_model_name: Qwen2.5-1.5B-Instruct
  saida: treinos/Qwen2.5-1.5B-Instruct(d23)
  ollama: Qwen2.5-1.5B-Instruct(d23):latest
  ollama_base: qwen2.5:1.5b
  ollama_url:

#| =========================================================================
#| TREINAMENTO
#| =========================================================================
treinamento:
  flash_attention_2: true
  liger_kernel: true
  full_com_sdpa: true

  eval_steps: 5%             # ~20 avaliações: caracteriza os marcadores virtuais

  batch_size:
    efetivo: 16
    batch_size: 2
  grad_batch_size: 8

  num_train_epochs: 4        # IGNORADO no modo fundido (1 época real concatenada)
  max_seq_length: 8192
  validar_max_seq_length: true

  learning_rate: 2e-05       # sobrescrito por fusao.learning_rate
  max_grad_norm: 1
  save_checkpoints: true
  resume_from_checkpoint: true
  warmup_steps: 100          # warmup GLOBAL (= rampa do G1, sempre ativo)
  weight_decay: 0.01
  optim: adamw_8bit

  lr_scheduler_type: cosine  # UM ciclo; gates multiplicam o envelope por grupo
  seed: 3407

  nbits: 16

  train_on_responses_only: true

#| =========================================================================
#| LORA (Low-Rank Adaptation)
#| =========================================================================
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
