# ==========================================================================
# Comparação: Controles do Protocolo B — quantização e posto do LoRA
# ==========================================================================
# Propósito: Precificar as duas escolhas de implementação embutidas no
#   baseline B, que de outra forma contaminam TODA comparação contra ele.
#   Os três protocolos são idênticos em dados (completos), pace (execução
#   única), orçamento (4 épocas), LR (2e-4) e regime (LoRA): mudam apenas
#   a precisão da base e o posto do adaptador.
#
#     b       LoRA NF4 (4 bits), r = 16   ← baseline usado nas demais comparações
#     b16     LoRA 16 bits,      r = 16   ← mesma capacidade, sem quantização
#     b16r8   LoRA 16 bits,      r =  8   ← mesma precisão, metade do posto
#
#   Comparações-chave:
#     b vs b16      → quanto do desempenho de B é limitado pelo erro de
#                     quantização NF4? Fator de correção para todo cruzamento
#                     entre protocolos 4 bits (b, d1-d15, d24) e 16 bits
#                     (d16-d23, d25).
#     b16 vs b16r8  → o posto do adaptador está saturado? Se b16 ≈ b16r8, r=16
#                     já é folga e o posto não explica diferenças observadas.
#     b vs b16r8    → efeito conjunto (precisão + posto), diagnóstico apenas.
#
# NOTA: b16 é a referência de execução ÚNICA que faltava para ler d16 e d17
#   sem confundir fronteira/ordenação com precisão — ver 06_compara_fronteiras.
# Modelos: b, b16, b16r8 (sem zero-shot: o objetivo é o contraste pareado)
# Executar com: python ../../src/comparar_extracoes.py --config 06_compara_controle_b.yaml
# ==========================================================================

# --- Miscelânea ---
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/pubmed-experimento
    - /mnt/d/wsl_dev/llms/experimentos/pubmed-experimento
    - /opt/app-root/src/luiz/llms/experimentos/pubmed-experimento
