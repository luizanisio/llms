# ==========================================================================
# Comparação: Ablações (decomposição dos componentes do framework CL+PT)
# ==========================================================================
# Propósito: Isolar a contribuição de cada componente, removendo um de cada vez.
#   - d5, d6: escalonamento SEM CL (isola o eixo PT por troca de regime)
#   - d7, d8: CL SEM escalonamento, LoRA-only 4b (isola o eixo CL)
#   - d13:    CL SEM escalonamento, FF-only 16b (contraparte FF do d7)
#   - d17:    CL SEM escalonamento, LoRA 16b (d7 sem a variável de quantização)
#   - d14:    warm-up LoRA completo + CL FF-only (PT como pré-treino, não como etapa)
#   - d15:    d14 + estabilização FF com LR 1e-6 após o merge LoRA→FF
#   Comparações-chave:
#     Q2  d7 vs b     → CL puro (LoRA 4b) melhora sobre FT direto?
#     Q2  d17 vs b    → CL puro (LoRA 16b) melhora sobre FT direto? (sem confundir com NF4)
#     Q2  d13 vs c    → CL puro (FF) melhora sobre FF direto?
#         d7 vs d17   → quanto do resultado do d7 vinha da quantização 4 bits?
#         d7 vs d13   → CL LoRA-only vs CL FF-only (regime dado o mesmo CL)
#     Q3  d5/d6 vs c  → escalonamento sem CL melhora sobre FF direto?
#     Q3  d5 vs d6    → direção do escalonamento sem CL
#         d7 vs d8    → pace por etapas disjuntas vs acumulado (sem escalonamento)
#     Q6  d14 vs d13  → o warm-up LoRA antes do CL ajuda ou custa (transição de regime)?
#     Q6  d15 vs d14  → a estabilização pós-merge recupera a perda da transição?
# Modelos: A (zero-shot), b (LoRA), c (FF), d5-d8, d13, d14, d15, d17
# Ver também: 06_compara_fronteiras (Q6 — custo de fronteira isolado),
#             06_compara_capacidade (eixo PT sem troca de regime)
# Executar com: python ../../src/comparar_extracoes.py --config 06_compara_ablacoes.yaml
# ==========================================================================

