# Modelos Comparados
modelos_comparacao:
  # --- A: zero-shot (sem ajuste fino) ---
  - arquivo: "saidas/saida_pubmed_1_5b.parquet"
    rotulo: "Qwen1.5B"
    alias: "A"
    familia: "Qwen-1.5B"
    baseline: true
  # --- B: LoRA 4b direto, dados completos (sem CL) ---
  - arquivo: "saidas/saida_pubmed_1_5b(b)_teste.parquet"
    rotulo: "Qwen1.5B(b)"
    alias: "B"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(b)"
  # --- C: Full FT 16b direto, dados completos (sem CL) ---
  - arquivo: "saidas/saida_pubmed_1_5b(c)_teste.parquet"
    rotulo: "Qwen1.5B(c)"
    alias: "C"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(c)"
  # --- D5: Escalonamento FF→LoRA sem CL (dados completos) ---
  - arquivo: "saidas/saida_pubmed_1_5b(d5)_teste.parquet"
    rotulo: "Qwen1.5B(d5)"
    alias: "D5"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d5)"
  # --- D6: Escalonamento LoRA→FF sem CL (dados completos) ---
  - arquivo: "saidas/saida_pubmed_1_5b(d6)_teste.parquet"
    rotulo: "Qwen1.5B(d6)"
    alias: "D6"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d6)"
  # --- D7: CL por etapas, LoRA-only 4b ---
  - arquivo: "saidas/saida_pubmed_1_5b(d7)_teste.parquet"
    rotulo: "Qwen1.5B(d7)"
    alias: "D7"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d7)"
  # --- D8: CL acumulado, LoRA-only 4b ---
  - arquivo: "saidas/saida_pubmed_1_5b(d8)_teste.parquet"
    rotulo: "Qwen1.5B(d8)"
    alias: "D8"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d8)"
  # --- D13: CL por etapas, FF-only 16b ---
  - arquivo: "saidas/saida_pubmed_1_5b(d13)_teste.parquet"
    rotulo: "Qwen1.5B(d13)"
    alias: "D13"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d13)"
  # --- D14: PT LoRA completo + CL por etapas FF-only ---
  - arquivo: "saidas/saida_pubmed_1_5b(d14)_teste.parquet"
    rotulo: "Qwen1.5B(d14)"
    alias: "D14"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d14)"
  # --- D15: PT LoRA + estabilização FF (LR 1e-6) + CL FF-only ---
  - arquivo: "saidas/saida_pubmed_1_5b(d15)_teste.parquet"
    rotulo: "Qwen1.5B(d15)"
    alias: "D15"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d15)"
  # --- D17: CL por etapas, LoRA 16b (D7 sem quantização) ---
  - arquivo: "saidas/saida_pubmed_1_5b(d17)_teste.parquet"
    rotulo: "Qwen1.5B(d17)"
    alias: "D17"
    familia: "Qwen-1.5B"
    pasta_treinamento: "treinos/Qwen2.5-1.5B-Instruct(d17)"

# Configuração das Métricas e Campos
configuracao_comparacao:
  padronizar_simbolos: true
  rouge_stemmer: true

  filtro:
    arquivo: "dados/pubmed-rct-20k.parquet"
    campo_id: "pmid"
    dataset_filtro: {"split": "test"}

  nome_campo_id: "id"
  rotulo_campo_id: "ID"

  campos_parquet:
    id: "chave"
    resposta: "resposta"
    resumo_tokens: "resumo"
    avaliacao: ""
    erro: "erro"

  modelos:
    bertscore_batch_size: 1024
    sbert_batch_size: 1024

  mascaras:
    extracao: "^(\\d+)\\.json$"
    tokens: ".tokens.json"
    avaliacao: ".avaliacao.json"
    observabilidade: ".obs.json"

  # Configuração das análises estatísticas (Friedman, Wilcoxon, Nemenyi, etc.)
  campos_estatisticas:
    campos:
      - "(global)"
      - "Sentencas"
      - "MetaDados"
    metricas:
      - rouge_l

  campos:

    rouge_1:

    rouge_2:
      - "title"
      - "publication"
      - "journal"
      - "keywords"

    rouge_l:
      - "(global)"
      - "title"
      - "publication"
      - "journal"
      - "keywords"
      - "background"
      - "objective"
      - "methods"
      - "results"
      - "conclusions"
      - "Sentencas"
      - "MetaDados"

    levenshtein:
      - "publication"
      - "journal"


campos_virtuais:
  Sentencas:
    - background
    - objective
    - methods
    - results
    - conclusions
  MetaDados:
    - title
    - publication
    - journal
    - keywords


estatistica:
  bayesiana: true
  frequentista: true
  protocolos:
    Panorama_Geral: "TODOS"
  metricas_automaticas:
    # ROPE: margem sobre os ESCORES BRUTOS — |x - y| <= rope conta como empate.
    # Obrigatoria (> 0). Com escores comprimidos e a ROPE que determina o
    # resultado: pequena demais satura o heatmap em verde/vermelho, grande
    # demais deixa tudo azul. Por isso a varredura abaixo e obrigatoria de
    # reportar — a matriz em tres ROPEs e o minimo defensavel.
    # Maior diferença de F1 entre as três rodadas de D1 em todas as métricas automáticas
    rope: 0.0030
    rope_sensibilidade: [0.0015, 0.0030, 0.0045]

    # Mesmos agregados de campos_estatisticas, sem o "(global)": Sentenças e
    # MetaDados sao os alvos de interesse das comparacoes pareadas.
    campos:
      - "Sentencas"
      - "MetaDados"
    metricas:
      - rouge_l