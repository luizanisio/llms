# Executar com: python ../../src/treinar_unsloth.py --treinar 04_treinar_d17.yaml
# Executar com: python ../../src/treinar_unsloth.py --datasets 04_treinar_d17.yaml

# ==========================================================================
# CONFIGURAÇÃO DE TREINAMENTO - Qwen 2.5 1.5B (Protocolo D17)
# ==========================================================================
# Papel:   Experimental (CL puro no regime LoRA, sem quantização)
# Modo:    LoRA 16 bits + CL por dificuldade
# Etapas:  fácil → médio → difícil → completo (2 épocas cada)
# Objetivo: Refazer o D7 (CL-LoRA) removendo a variável de quantização NF4.
#           Comparado ao D16 (mesmas 3 fronteiras, mesmo warmup, mesma
#           precisão, mesmo orçamento), a ÚNICA diferença é a composição dos
#           dados por etapa — teste limpo de "a ordenação curricular ajuda?".
# Orçamento: (fácil+médio+difícil = N) × 2 + completo N × 2 = 4N instâncias.
# Comparar: d17 vs d16 (ordenação com fronteiras controladas),
#           d17 vs d18 (dificuldade vs blocos aleatórios), d17 vs d7 (efeito do 4-bit)
# Ambiente: H100 80GB (1 GPU via Slurm)
# ==========================================================================

#| =========================================================================
#| MISCELÂNEA
#| =========================================================================
misc:
  pastas_base:
    - /students/luiz.abatitucci/llms/experimentos/pubmed-experimento
    - /mnt/d/wsl_dev/llms/experimentos/pubmed-experimento
    - /opt/app-root/src/luiz/llms/experimentos/pubmed-experimento
  pastas_modelos:
    - /students/luiz.abatitucci/models
    - /mnt/d/wsl_ollama/hf-models
    - /opt/app-root/src/luiz/llms/_models

#| =========================================================================
#| CURRICULUM
#| =========================================================================
curriculum:
  saida:
    dataframe: saidas/saida_pubmed_prof.parquet
    dataframe_col: resposta
    dataframe_id: chave
    formato: json
    texto_criptografado: false

  entrada:
    dataframe: dados/pubmed-rct-20k.parquet
    dataframe_col: article
    dataframe_id: pmid
    prompt_template: dados/prompt_pubmed_rct.txt
    tag_texto: '<<--TEXTO-->>'
    texto_criptografado: false
    prompt_criptografado: false

  validacao:
    exigir_json_valido: true
    exigir_ids_pareados: false

  #| CL clássico por dificuldade — espelho exato do D7, agora em 16 bits.
  divisao:
  - arquivo: compara/analises_comparacao_pubmed (full)/divisoes/divisao_Professor_Qwen1_5B.csv
    dataset_filtro: {"dificuldade": "facil"}
    alias: "fácil"
    tipo: "lora"
    pace_epochs: 2
    learning_rate: 2e-05
  - arquivo: compara/analises_comparacao_pubmed (full)/divisoes/divisao_Professor_Qwen1_5B.csv
    dataset_filtro: {"dificuldade": "medio"}
    alias: "médio"
    tipo: "lora"
    pace_epochs: 2
    learning_rate: 2e-05
  - arquivo: compara/analises_comparacao_pubmed (full)/divisoes/divisao_Professor_Qwen1_5B.csv
    dataset_filtro: {"dificuldade": "dificil"}
    alias: "difícil"
    tipo: "lora"
    pace_epochs: 2
    learning_rate: 2e-05
  - arquivo: compara/analises_comparacao_pubmed (full)/divisoes/divisao_Professor_Qwen1_5B.csv
    alias: "completo"
    tipo: "lora"
    pace_epochs: 2
    learning_rate: 2e-05

#| =========================================================================
#| MODELO
#| =========================================================================
modelo:
  base_model_name: Qwen2.5-1.5B-Instruct
  saida: treinos/Qwen2.5-1.5B-Instruct(d17)
  ollama: Qwen2.5-1.5B-Instruct(d17):latest
  ollama_base: qwen2.5:1.5b
  ollama_url:

#| =========================================================================
#| TREINAMENTO
#| =========================================================================
treinamento:
  flash_attention_2: true
  liger_kernel: true
  full_com_sdpa: true

  eval_steps: 20%

  batch_size:
    efetivo: 16
    batch_size: 2
  grad_batch_size: 8

  num_train_epochs: 4
  max_seq_length: 8192
  validar_max_seq_length: true

  learning_rate: 2e-05
  max_grad_norm: 1
  save_checkpoints: true
  resume_from_checkpoint: true
  warmup_steps: 100          # Idêntico a D16/D18 — fronteiras comparáveis
  weight_decay: 0.01
  optim: adamw_8bit

  lr_scheduler_type: cosine
  seed: 3407

  nbits: 16                  # 16 bits: sem NF4, sem erro de quantização

  train_on_responses_only: true

#| =========================================================================
#| LORA (Low-Rank Adaptation)
#| =========================================================================
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
